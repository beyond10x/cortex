version: '3'

vars:
  CARGO: 'env CARGO_BUILD_JOBS=4 RUST_TEST_THREADS=4 nice -n 19 cargo'
  ESS: ess
  TEST_BUDGET: enforce
  TEST_THREADS: '12'
  TEST_POSTGRES_IMAGE: postgres:17

tasks:
  generate:
    desc: Regenerate everything under generated/ and spec/suite.json from spec/
    cmds:
      - rm -rf generated/cortex-model generated/spec-types generated/schema generated/docs
      - '{{.ESS}} specify validate --path spec --strict-requires'
      - '{{.ESS}} generate synthesize --path spec --target rust --layout crate --out generated/cortex-model --strict-requires'
      - '{{.ESS}} generate types --path spec --target rust --root cortex.instance.InstanceSpec --root cortex.ask.AskEvent --package cortex-spec-types --out generated/spec-types --strict-requires'
      - '{{.ESS}} generate --path spec --kind schema --out generated/schema --strict-requires'
      - '{{.ESS}} generate --path spec --kind docs --out generated/docs --strict-requires'
      - '{{.ESS}} verify conform synthesize --path spec --scenarios spec --out spec/suite.json --strict-requires'
      - task: docs-generate

  drift:
    desc: Fail when generated/ or spec/suite.json differ from what spec/ generates
    cmds:
      - |
        set -eu
        tmp=$(mktemp -d "${TMPDIR:-$HOME/.cache}/cortex-drift.XXXXXX")
        trap 'rm -rf "$tmp"' EXIT
        mkdir -p "$tmp/generated"
        {{.ESS}} generate synthesize --path spec --target rust --layout crate --out "$tmp/generated/cortex-model" --strict-requires >/dev/null
        {{.ESS}} generate types --path spec --target rust --root cortex.instance.InstanceSpec --root cortex.ask.AskEvent --package cortex-spec-types --out "$tmp/generated/spec-types" --strict-requires >/dev/null
        {{.ESS}} generate --path spec --kind schema --out "$tmp/generated/schema" --strict-requires >/dev/null
        {{.ESS}} generate --path spec --kind docs --out "$tmp/generated/docs" --strict-requires >/dev/null
        {{.ESS}} verify conform synthesize --path spec --scenarios spec --out "$tmp/suite.json" --strict-requires >/dev/null
        diff -r --exclude=.ess-output generated "$tmp/generated"
        cmp spec/suite.json "$tmp/suite.json"
        echo "generated/ and spec/suite.json match spec/"

  compat:
    desc: Fail when spec/ changes incompatibly against the newest release tag and spec/compat-ack.json does not acknowledge it
    cmds:
      - |
        set -eu
        tag=$(git describe --tags --abbrev=0 --match 'v[0-9]*')
        tmp=$(mktemp -d "${TMPDIR:-$HOME/.cache}/cortex-compat.XXXXXX")
        trap 'rm -rf "$tmp"' EXIT
        git archive "$tag" spec | tar -x -C "$tmp"
        if [ -f "spec/compat-base-$tag.patch" ]; then
          echo "spec/ at $tag brought to the form the pinned ess reads: spec/compat-base-$tag.patch"
          patch --quiet --forward -p1 -d "$tmp" -i "$PWD/spec/compat-base-$tag.patch"
        fi
        echo "spec/ against $tag"
        {{.ESS}} verify diff --from "$tmp/spec" --to spec --fail-on breaking-or-unknown --acknowledgements spec/compat-ack.json

  build:
    desc: Build the cortex binary
    cmds:
      - '{{.CARGO}} build --locked --release'

  test-build:
    desc: Build every test binary, outside the test step's budget
    cmds:
      - '{{.CARGO}} nextest run --locked --workspace --no-run'

  test-postgres-image:
    desc: Pull the PostgreSQL test server's image while the test binaries build, when a container runtime runs and the image is not there yet
    cmds:
      - |
        if docker info >/dev/null 2>&1 && ! docker image inspect {{.TEST_POSTGRES_IMAGE}} >/dev/null 2>&1; then
          docker pull -q {{.TEST_POSTGRES_IMAGE}}
        fi

  test:
    desc: Run every test with cargo-nextest; a test over 60 s fails; the step prints its wall time and ten slowest tests, counts the PostgreSQL test servers it started, warns over 90 s, and with TEST_BUDGET=enforce (the default) fails over 120 s
    deps: [test-build, test-postgres-image]
    cmds:
      - |
        set -u
        case "{{.TEST_BUDGET}}" in
          enforce) profile=budget ;;
          report) profile=default ;;
          *) echo "TEST_BUDGET is report or enforce, not {{.TEST_BUDGET}}" >&2; exit 2 ;;
        esac
        junit=target/nextest/$profile/junit.xml
        rm -f "$junit"
        pgstarts="${CARGO_TARGET_DIR:-target}/tmp/cortex-test-postgres-v1/starts.log"
        pgbefore=$(cat "$pgstarts" 2>/dev/null | wc -l)
        start=$(date +%s)
        status=0
        {{.CARGO}} nextest run --locked --workspace --no-tests=fail --profile "$profile" --test-threads {{.TEST_THREADS}} || status=$?
        elapsed=$(( $(date +%s) - start ))
        echo "ten slowest tests (seconds):"
        if [ -f "$junit" ]; then
          grep -o '<testcase [^>]*>' "$junit" \
            | sed -n 's/.* name="\([^"]*\)".* time="\([^"]*\)".*/\2 \1/p' \
            | sort -rn | head -n 10 | sed 's/^/  /'
        else
          echo "  no report at $junit"
        fi
        echo "PostgreSQL test servers started: $(( $(cat "$pgstarts" 2>/dev/null | wc -l) - pgbefore ))"
        echo "test step: $elapsed s of a 120 s budget"
        if [ "$elapsed" -gt 90 ]; then
          echo "warning: the test step ran $elapsed s, over the 90 s it is held to; 30 s of the 120 s budget are kept free"
        fi
        [ "$status" -eq 0 ] || exit "$status"
        if [ "$elapsed" -gt 120 ]; then
          echo "the test step ran $elapsed s, over its 120 s budget (TEST_BUDGET={{.TEST_BUDGET}})" >&2
          [ "$profile" = default ] || exit 1
        fi

  check:
    desc: The gate — spec validity, generated-code drift, spec compatibility, fmt, clippy, tests
    cmds:
      - '{{.ESS}} specify validate --path spec --strict-requires'
      - task: drift
      - task: compat
      - '{{.CARGO}} fmt -p cortex-cli -p cortex-docs -- --check'
      - '{{.CARGO}} clippy --locked --workspace --all-targets -- -D warnings'
      - task: test
      - task: docs-check

  docs-generate:
    desc: Regenerate the derived documentation files under website/ from spec/
    cmds:
      - '{{.CARGO}} run --locked -p cortex-docs -- generate --ess {{.ESS}}'

  docs-check:
    desc: Fail when a generated documentation file is missing, stale or edited by hand
    cmds:
      - '{{.CARGO}} run --locked -p cortex-docs -- generate --check --ess {{.ESS}}'

  website:
    desc: Build the documentation site, as CI's Documentation validation workflow does
    dir: website
    cmds:
      - npm ci
      - npm run build
