version: '3'

vars:
  CARGO: 'env CARGO_BUILD_JOBS=4 RUST_TEST_THREADS=4 nice -n 19 cargo'
  ESS: ess

tasks:
  generate:
    desc: Regenerate everything under generated/ and spec/suite.json from spec/
    cmds:
      - rm -rf generated/cortex-model generated/spec-types generated/schema generated/docs
      - '{{.ESS}} specify validate --path spec --strict-requires'
      - '{{.ESS}} generate synthesize --path spec --target rust --layout crate --out generated/cortex-model --strict-requires'
      - '{{.ESS}} generate types --path spec --target rust --root cortex.instance.InstanceSpec --root cortex.ask.AskEvent --package cortex-spec-types --out generated/spec-types --strict-requires'
      - '{{.ESS}} generate --path spec --kind schema --out generated/schema --strict-requires'
      - '{{.ESS}} generate --path spec --kind docs --out generated/docs --strict-requires'
      - '{{.ESS}} verify conform synthesize --path spec --out spec/suite.json --strict-requires'
      - task: docs-generate

  drift:
    desc: Fail when generated/ or spec/suite.json differ from what spec/ generates
    cmds:
      - |
        set -eu
        tmp=$(mktemp -d "${TMPDIR:-$HOME/.cache}/cortex-drift.XXXXXX")
        trap 'rm -rf "$tmp"' EXIT
        mkdir -p "$tmp/generated"
        {{.ESS}} generate synthesize --path spec --target rust --layout crate --out "$tmp/generated/cortex-model" --strict-requires >/dev/null
        {{.ESS}} generate types --path spec --target rust --root cortex.instance.InstanceSpec --root cortex.ask.AskEvent --package cortex-spec-types --out "$tmp/generated/spec-types" --strict-requires >/dev/null
        {{.ESS}} generate --path spec --kind schema --out "$tmp/generated/schema" --strict-requires >/dev/null
        {{.ESS}} generate --path spec --kind docs --out "$tmp/generated/docs" --strict-requires >/dev/null
        {{.ESS}} verify conform synthesize --path spec --out "$tmp/suite.json" --strict-requires >/dev/null
        diff -r --exclude=.ess-output generated "$tmp/generated"
        cmp spec/suite.json "$tmp/suite.json"
        echo "generated/ and spec/suite.json match spec/"

  compat:
    desc: Fail when spec/ changes incompatibly against the newest release tag and spec/compat-ack.json does not acknowledge it
    cmds:
      - |
        set -eu
        tag=$(git describe --tags --abbrev=0 --match 'v[0-9]*')
        tmp=$(mktemp -d "${TMPDIR:-$HOME/.cache}/cortex-compat.XXXXXX")
        trap 'rm -rf "$tmp"' EXIT
        git archive "$tag" spec | tar -x -C "$tmp"
        echo "spec/ against $tag"
        {{.ESS}} verify diff --from "$tmp/spec" --to spec --fail-on breaking-or-unknown --acknowledgements spec/compat-ack.json

  build:
    desc: Build the cortex binary
    cmds:
      - '{{.CARGO}} build --locked --release'

  test:
    desc: Run every test
    cmds:
      - '{{.CARGO}} test --locked --workspace'

  check:
    desc: The gate — spec validity, generated-code drift, spec compatibility, fmt, clippy, tests
    cmds:
      - '{{.ESS}} specify validate --path spec --strict-requires'
      - task: drift
      - task: compat
      - '{{.CARGO}} fmt -p cortex-cli -p cortex-docs -- --check'
      - '{{.CARGO}} clippy --locked --workspace --all-targets -- -D warnings'
      - task: test
      - task: docs-check

  docs-generate:
    desc: Regenerate the derived documentation files under website/ from spec/
    cmds:
      - '{{.CARGO}} run --locked -p cortex-docs -- generate --ess {{.ESS}}'

  docs-check:
    desc: Fail when a generated documentation file is missing, stale or edited by hand
    cmds:
      - '{{.CARGO}} run --locked -p cortex-docs -- generate --check --ess {{.ESS}}'

  website:
    desc: Build the documentation site, as CI's Documentation validation workflow does
    dir: website
    cmds:
      - npm ci
      - npm run build
