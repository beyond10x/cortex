components:
  - component: cortex
    summary: >-
      The operator's command line: create, update, run and remove instances, and switch a source off
      and on. A systemd user timer per source calls the same binary.
    owns:
      domains:
        - cortex.instance
    accepts:
      commands:
        - cortex.instance.CreateInstance
        - cortex.instance.AdoptInstance
        - cortex.instance.UpdateInstance
        - cortex.instance.RemoveInstance
        - cortex.instance.AddSource
        - cortex.instance.RunSource
        - cortex.instance.RecordFailure
        - cortex.instance.EnableSource
        - cortex.instance.RestoreSnapshot
        - cortex.instance.MeasureQuality
        - cortex.instance.RunEval
        - cortex.instance.AddEvalCase
        - cortex.instance.ProposeSchemaChanges
        - cortex.instance.ApproveSchemaProposals
        - cortex.instance.RejectSchemaProposals
        - cortex.instance.ApplySchemaProposals
    publishes:
      events:
        - cortex.instance.InstanceCreated
        - cortex.instance.InstanceAdopted
        - cortex.instance.InstanceUpdated
        - cortex.instance.InstanceRemoved
        - cortex.instance.SourceAdded
        - cortex.instance.SourceRan
        - cortex.instance.RunFailed
        - cortex.instance.SourceDisabled
        - cortex.instance.SourceEnabled
        - cortex.instance.SnapshotRestored
        - cortex.instance.QualityMeasured
        - cortex.instance.EvalRan
        - cortex.instance.EvalCaseAdded
        - cortex.instance.SchemaChangesProposed
        - cortex.instance.SchemaProposalsDecided
        - cortex.instance.SchemaProposalsApplied
    reached_by: command_line
    cli:
      binary: cortex
      commands:
        - cortex.instance.CreateInstance
        - cortex.instance.AdoptInstance
        - cortex.instance.UpdateInstance
        - cortex.instance.RemoveInstance
        - cortex.instance.RunSource
        - cortex.instance.RestoreSnapshot
        - cortex.instance.MeasureQuality
        - cortex.instance.ProposeSchemaChanges
      groups:
        - name: source
          summary: One data source of an instance
          commands:
            - cortex.instance.AddSource
            - cortex.instance.RecordFailure
            - cortex.instance.EnableSource
        - name: schema
          summary: The decisions on a review run of schema proposals, and their apply
          commands:
            - cortex.instance.ApproveSchemaProposals
            - cortex.instance.RejectSchemaProposals
            - cortex.instance.ApplySchemaProposals
        - name: eval
          summary: Eval sets asked of an instance end to end and scored
          commands:
            - cortex.instance.RunEval
            - cortex.instance.AddEvalCase
      views:
        - cortex.instance.Instances
        - cortex.instance.Sources

  - component: cortex-ask
    summary: >-
      The answer service, `cortex ask serve --spec <instance spec>`: a long-running process that
      answers `POST /ask` as a stream of events over the instance's store, read through the EKR MCP
      reader. The batch component `cortex` serves no port; this one serves the spec's `ask.listen`.
      It keeps every answer with its votes and a review queue in `ask.sqlite` in the instance
      directory, and purges them after the spec's `retention_days`.
    owns:
      domains:
        - cortex.ask
    accepts:
      commands:
        - cortex.ask.Ask
        - cortex.ask.RecordAnswer
        - cortex.ask.CastVote
        - cortex.ask.OpenReview
        - cortex.ask.CloseReview
        - cortex.ask.PurgeExpired
    publishes:
      events:
        - cortex.ask.Answered
        - cortex.ask.AnswerRecorded
        - cortex.ask.Voted
        - cortex.ask.ReviewOpened
        - cortex.ask.ReviewClosed
        - cortex.ask.Purged
