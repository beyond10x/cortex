domain: cortex.instance

summary: >-
  Instances of a knowledge brain and the data sources that feed them. An instance owns one EKR
  store, created from the instance spec's seed. A source fetches documents on its own schedule,
  keeps those that are new or changed, has a model extract them into an EKR extraction document
  and applies it to the instance's store.

naming:
  wire: instance
  display: Instances

types:
  - name: cortex.instance.InstanceName
    kind: newtype
    of: String

  - name: cortex.instance.SourceId
    kind: newtype
    of: String

  - name: cortex.instance.DocumentId
    kind: newtype
    of: String

  - name: cortex.instance.SourceKind
    kind: enum
    variants: [Web, Connectors, Files, Structured]

  - name: cortex.instance.WebMode
    kind: enum
    variants: [Pages, Crawl]

  - name: cortex.instance.SearchTopic
    kind: enum
    variants: [general, news]

  - name: cortex.instance.TimeRange
    kind: enum
    variants: [day, week, month, year]


  - name: cortex.instance.ChangeDetection
    kind: enum
    variants: [ContentHash]

  - name: cortex.instance.SearchPolicy
    kind: struct
    fields:
      - {name: topic, type: cortex.instance.SearchTopic}
      - {name: time_range, type: Optional<cortex.instance.TimeRange>}
      - {name: max_results, type: Integer}
      - {name: include_domains, type: List<String>}
      - {name: exclude_domains, type: List<String>}
      - {name: country, type: Optional<String>}
      - {name: language, type: Optional<String>}

  - name: cortex.instance.SearchInput
    kind: struct
    fields:
      - {name: queries, type: List<String>}
      - {name: policy, type: cortex.instance.SearchPolicy}

  - name: cortex.instance.CrawlPolicy
    kind: struct
    fields:
      - {name: max_depth, type: Integer}
      - {name: max_breadth, type: Integer}
      - {name: limit, type: Integer}
      - {name: select_paths, type: List<String>}
      - {name: exclude_paths, type: List<String>}
      - {name: instructions, type: Optional<String>}
      - {name: allow_external, type: Boolean}

  - name: cortex.instance.SitesInput
    kind: struct
    fields:
      - {name: urls, type: List<String>}
      - {name: mode, type: cortex.instance.WebMode}
      - {name: policy, type: Optional<cortex.instance.CrawlPolicy>}

  - name: cortex.instance.WebInput
    kind: union
    tag: input
    variants:
      sites: cortex.instance.SitesInput
      search: cortex.instance.SearchInput

  - name: cortex.instance.FetchPolicy
    kind: struct
    fields:
      - {name: refresh_after_days, type: Integer}
      - {name: change, type: cortex.instance.ChangeDetection}
      - {name: max_documents_per_run, type: Integer}
      - {name: max_chars_per_document, type: Integer}

  - name: cortex.instance.WebSource
    kind: struct
    fields:
      # The Connectors adapter answering datasource.websearch/v1alpha1; absent means tavily.
      - {name: adapter, type: Optional<String>}
      # The connection, named by id (`connection`) or by profile (`profile`), exactly one of the
      # two; see `cortex.instance.ConnectionRef` for how a profile is resolved.
      - {name: connection, type: Optional<String>}
      - {name: profile, type: Optional<String>}
      - {name: input, type: cortex.instance.WebInput}
    # UNMAPPED: not both `connection` and `profile`: conformance synthesis witnesses every
    # Optional as present, so that invariant leaves no spec it can build; `spec::check` refuses it.
    invariants:
      - any:
          - defined(connection)
          - defined(profile)

  # How a paged operation names its next page. `NextLink` reads a URL, relative or absolute, at the
  # paging's `next` path; the percent-decoded value of its query parameter named by the last
  # segment of `param` is the next `param`. A missing, null or empty link ends the walk; a link
  # without that parameter ends it and leaves the operation's pages unread.
  - name: cortex.instance.PageStyle
    kind: enum
    variants: [PageNumber, Token, Keyset, NextLink]

  # `stop_older_than_since: true` ends the walk at the first record whose `time` is older than the
  # run's `{since}`: that record and the ones after it are not taken, and nothing is left unread.
  # A record with no readable time does not stop it; `max_pages` reached first leaves pages
  # unread as without the rule. Only a `connectors` source's own paging with a `time` takes it
  # (the invariants of `ConnectorsSource`, `ChildCall`, `StructuredConnectors`, `StructuredChild`
  # and `CompareLink`); `src/model_map.rs` refuses a spec that breaks one at load.
  - name: cortex.instance.Paging
    kind: struct
    fields:
      - {name: style, type: cortex.instance.PageStyle}
      - {name: param, type: String}
      - {name: next, type: Optional<String>}
      - {name: max_pages, type: Integer}
      - {name: stop_older_than_since, type: Optional<Boolean>}

  - name: cortex.instance.ChildCall
    kind: struct
    fields:
      - {name: operation, type: String}
      - {name: input, type: Json}
      - {name: records, type: String}
      - {name: paging, type: Optional<cortex.instance.Paging>}
    invariants:
      - paging.stop_older_than_since != true

  - name: cortex.instance.ConnectorsSource
    kind: struct
    fields:
      - {name: adapter, type: String}
      # By id or by profile of `adapter`, exactly one, as on `cortex.instance.WebSource`.
      - {name: connection, type: Optional<String>}
      - {name: profile, type: Optional<String>}
      - {name: operation, type: String}
      # UNMAPPED: in every string value of an input, a run replaces the window placeholders by its
      # window, each end cut to the second: `{since}` and `{until}` by RFC 3339 in UTC
      # (`2026-10-05T12:34:56Z`), `{since_epoch}` and `{until_epoch}` by the same instants as
      # whole seconds since the Unix epoch, a decimal string (`1790000000`). Any other text,
      # another `{...}` included, reaches Connectors unchanged. ESS states no rule on the text
      # of a Json value; src/sources.rs and tests/connectors_walks.rs hold it.
      - {name: inputs, type: List<Json>}
      - {name: records, type: String}
      - {name: id, type: String}
      - {name: time, type: Optional<String>}
      - {name: text, type: List<String>}
      - {name: paging, type: Optional<cortex.instance.Paging>}
      - {name: child, type: Optional<cortex.instance.ChildCall>}
    # UNMAPPED: not both `connection` and `profile`: conformance synthesis witnesses every
    # Optional as present, so that invariant leaves no spec it can build; `spec::check` refuses it.
    invariants:
      - any: ["paging.stop_older_than_since != true", "defined(time)"]
      - any:
          - defined(connection)
          - defined(profile)

  - name: cortex.instance.RecordFormat
    kind: enum
    variants: [WholeFile, JsonLines, MarkdownSections]

  - name: cortex.instance.RecordFilter
    kind: struct
    fields:
      - {name: field, type: String}
      - {name: values, type: List<String>}
      - {name: include, type: Boolean}

  - name: cortex.instance.FileRecords
    kind: struct
    fields:
      - {name: format, type: cortex.instance.RecordFormat}
      - {name: id, type: String}
      - {name: time, type: Optional<String>}
      - {name: author, type: Optional<String>}
      - {name: text, type: List<String>}
      - {name: fallback_text, type: Optional<List<String>>}
      - {name: thread, type: Optional<String>}
      - {name: filters, type: List<cortex.instance.RecordFilter>}
      - {name: lookup, type: Optional<String>}

  - name: cortex.instance.FilesSource
    kind: struct
    fields:
      - {name: paths, type: List<String>}
      - {name: glob, type: String}
      - {name: records, type: Optional<cortex.instance.FileRecords>}

  # One mapped property of a structured record. `value_kind` is the kind cortex declares the
  # property in and converts each record's value to; without it, cortex reuses the kind the
  # store's ontology declares for that property of the node type, and `String` when the store
  # declares none.
  # UNMAPPED: a record whose value does not convert to the kind (`Integer`: a JSON integer or a
  # decimal integer string; `Decimal`: a number or a decimal string; `Boolean`: `true`/`false` in
  # JSON or text; `Timestamp`: RFC 3339) is refused alone: it is left out of the batch and named
  # with its key and the property in the run's report and `cortex.log`, and the rest of the batch
  # is applied. The record is marked seen with its key and content hash, like an applied one, so
  # it is skipped until its source text changes and no longer counts against a later run's
  # `max_documents_per_run`; a changed record is selected again. A `value_kind` that differs from the kind the store declares is refused when the
  # spec is read (`create`, `update`, a run), naming the node type, the property and both kinds.
  # The specification has no construct for a conversion of a record's value or for the store's
  # ontology; `src/structured.rs` holds them and `tests/structured_value_kinds.rs` tests them.
  - name: cortex.instance.PropertyMapping
    kind: struct
    fields:
      - {name: property, type: String}
      - {name: path, type: String}
      - {name: value_kind, type: Optional<cortex.instance.SchemaValueKind>}

  - name: cortex.instance.RelationMapping
    kind: struct
    fields:
      - {name: relation, type: String}
      - {name: target_type, type: String}
      - {name: target_name, type: String}

  - name: cortex.instance.RecordMapping
    kind: struct
    fields:
      - {name: node_type, type: String}
      - {name: id, type: String}
      - {name: name, type: String}
      - {name: aliases, type: List<String>}
      - {name: properties, type: List<cortex.instance.PropertyMapping>}
      - {name: relations, type: List<cortex.instance.RelationMapping>}

  - name: cortex.instance.StructuredChild
    kind: struct
    fields:
      - {name: operation, type: String}
      - {name: input, type: Json}
      - {name: records, type: String}
      - {name: paging, type: Optional<cortex.instance.Paging>}
      - {name: mapping, type: cortex.instance.RecordMapping}
      - {name: time, type: Optional<String>}
      - {name: parent, type: String}
    invariants:
      - paging.stop_older_than_since != true

  - name: cortex.instance.CompareLink
    kind: struct
    fields:
      - {name: operation, type: String}
      - {name: input, type: Json}
      - {name: records, type: String}
      - {name: paging, type: Optional<cortex.instance.Paging>}
      - {name: tags, type: String}
      - {name: changes, type: String}
      - {name: order, type: String}
      - {name: change_id, type: String}
      - {name: relation, type: String}
    invariants:
      - paging.stop_older_than_since != true

  - name: cortex.instance.StructuredConnectors
    kind: struct
    fields:
      - {name: adapter, type: String}
      # By id or by profile of `adapter`, exactly one, as on `cortex.instance.WebSource`.
      - {name: connection, type: Optional<String>}
      - {name: profile, type: Optional<String>}
      - {name: operation, type: String}
      # UNMAPPED: the window placeholders of `cortex.instance.ConnectorsSource.inputs` hold here
      # alike: `{since}`, `{until}` (RFC 3339), `{since_epoch}`, `{until_epoch}` (whole epoch
      # seconds). The inputs of `children` and `links` are filled from records, not the window.
      - {name: inputs, type: List<Json>}
      - {name: paging, type: Optional<cortex.instance.Paging>}
      - {name: children, type: Optional<List<cortex.instance.StructuredChild>>}
      - {name: links, type: Optional<List<cortex.instance.CompareLink>>}
    # UNMAPPED: not both `connection` and `profile`: conformance synthesis witnesses every
    # Optional as present, so that invariant leaves no spec it can build; `spec::check` refuses it.
    invariants:
      - paging.stop_older_than_since != true
      - any:
          - defined(connection)
          - defined(profile)

  - name: cortex.instance.StructuredFiles
    kind: struct
    fields:
      - {name: paths, type: List<String>}
      - {name: glob, type: String}

  - name: cortex.instance.StructuredInput
    kind: union
    tag: from
    variants:
      connectors: cortex.instance.StructuredConnectors
      files: cortex.instance.StructuredFiles

  - name: cortex.instance.DropPolicy
    kind: enum
    variants: [Keep, Supersede]

  - name: cortex.instance.StructuredSource
    kind: struct
    fields:
      - {name: input, type: cortex.instance.StructuredInput}
      - {name: records, type: String}
      - {name: mapping, type: cortex.instance.RecordMapping}
      - {name: dropped, type: Optional<cortex.instance.DropPolicy>}

  - name: cortex.instance.SourceSettings
    kind: union
    tag: kind
    variants:
      web: cortex.instance.WebSource
      connectors: cortex.instance.ConnectorsSource
      files: cortex.instance.FilesSource
      structured: cortex.instance.StructuredSource

  - name: cortex.instance.SourceSpec
    kind: struct
    fields:
      - {name: name, type: String}
      - {name: schedule, type: String}
      - {name: settings, type: cortex.instance.SourceSettings}
      - {name: policy, type: cortex.instance.FetchPolicy}

  - name: cortex.instance.SeedSpec
    kind: struct
    fields:
      - {name: schema, type: Optional<String>}
      - {name: ekr_seed, type: Optional<String>}
      - {name: documents, type: List<String>}

  - name: cortex.instance.ModelBackend
    kind: enum
    variants: [Claude, Codex]

  # `daily_ceiling_usd`, when given, bounds what the instance's model calls spend in one UTC
  # calendar day, across every source run, seed extraction, quality measurement and schema
  # proposal of the instance: each call is allowed the lesser of what is left of its own
  # `budget_usd` and what is left of the ceiling (`cortex.instance.DailySpend`). A number of US
  # dollars, above 0; absent means no ceiling.
  #
  # `budget_tokens` and `daily_ceiling_tokens`, when given, bound the same runs and calls in
  # tokens, for a model whose cost `claude` cannot report (one behind a gateway): `budget_tokens`
  # the tokens of one run, `daily_ceiling_tokens` the tokens of the instance in one UTC calendar
  # day (`cortex.instance.DailySpend`). A call's tokens are what its answer's `usage` reports:
  # input, cache reads, cache writes and output together. An answer whose `usage` reports no
  # count, a count below 0, or counts whose sum (or whose sum with the tokens already used) does
  # not fit a signed 64-bit integer has tokens that could not be counted. Each limit is checked
  # before a batch: a run that reached either stops before its next batch, keeps what it applied,
  # and its reason names the limit. Under a token limit, an answer whose tokens could not be
  # counted stops the run before its next batch, the reason saying so; that is not a reached
  # daily ceiling (`cortex.instance.SourceRan.daily_ceiling_reached` stays false). A quality
  # measurement and a schema proposal are held to `budget_tokens` as to `budget_usd`: each stops
  # before a further model call once its own answers' tokens reach it, or once one of its answers'
  # tokens could not be counted. An Integer above 0; absent means no limit in tokens. The dollar
  # limits apply beside them unchanged.
  #
  # `gateway`, when given, sends the model calls through a model gateway
  # (`cortex.instance.ModelGateway`), and the instance is bounded in tokens only: the cost `claude`
  # reports for an answer behind a gateway is priced at its default model's rate, not observed, so
  # it counts against no `budget_usd`, no `daily_ceiling_usd` and no budget of a quality
  # measurement or a schema proposal, and `--max-budget-usd` is not passed to `claude`. Such a
  # cost is still reported, as not counted (`cortex.instance.SourceRan.cost_counted`,
  # `cortex.instance.DailySpend.uncounted_usd`).
  #
  # `budget_usd` is required without a gateway and may be omitted with one; `budget_tokens` is
  # required with a gateway, so a gateway instance is never unbounded. The spec check refuses
  # (exit 2, naming the field, before anything is written, for `create`, `update` and `adopt`
  # alike) a spec that breaks either rule. A gateway spec that still gives `budget_usd` or
  # `daily_ceiling_usd` is accepted, and `create`, `update` and `adopt` print one line on stderr
  # saying the dollar limits bound nothing behind a gateway, naming a run gate's `cost_usd` check
  # too when the spec has one (`cortex.instance.GateCheck`). `create`, `update` and `adopt` also
  # refuse a `budget_usd` or `daily_ceiling_usd` too large to be read as a finite number, naming
  # the field. An instance's frozen spec is held to neither of these two rules, so an instance
  # created with a gateway before them keeps running: with no `budget_tokens` its answers' costs
  # count against its dollar limits as before, until an `update` gives it one.
  # UNMAPPED: a field required or optional by the presence of another, and a decimal bounded to
  # what a finite number holds, have no construct in the specification; `spec::check`
  # (`budget_usd`) and `spec::load_given` (`budget_tokens`, the finite dollar limits) hold the
  # rules, `spend::counts_dollars` the frozen-spec case, and `tests/gateway_dollar_limits.rs` and
  # `tests/gateway_dollar_limits_adv.rs` test them.
  #
  # `batch_chars`, when given, is the most characters of document text one extraction request
  # carries (a longer document goes alone); at least 1,000. A character is counted as its UTF-8
  # bytes, as before this field: a Latin letter counts 1, a non-Latin character 2 to 3, for the
  # given size, the derived one and the default alike. Without it, behind a gateway that
  # gives `max_context_tokens`, it is derived from the model's window: the input room is
  # `max_context_tokens` less the output reserve (`gateway.max_output_tokens` when given, else a
  # quarter of `max_context_tokens`); the size is 1.5 characters per token of that room, less the
  # characters of the request's fixed part (the system prompt, the answer's schema, and the prompt
  # up to the documents) as the run starts, at least 4,000 and at most 60,000. Otherwise it is
  # 60,000. A run states the size it used (`cortex.instance.SourceRan.batch_chars`). A request
  # `claude` answers as too long for the model's window (an error answer whose text holds
  # `Prompt is too long`, `Input is too long`, `maximum context length` or
  # `context_length_exceeded`, in any case) or as cut off at the output limit (one holding
  # `output token maximum` or `reached its context window limit`) is split in two halves by
  # documents and each half asked again, at most 3 splits deep (a batch becomes at most 8 parts);
  # a part of one document is not split. Such an answer is not asked again after a wait, and its
  # calls count against the token and dollar limits as any call does. A part of one document that
  # still does not fit is left out alone and the run goes on (`cortex.instance.RunSource`, `ran`);
  # a part of several documents that still does not fit after 3 splits ends the run as
  # `batch-too-large`, which is not counted against the source. `cortex quality` and
  # `cortex schema` keep their own batch sizes.
  # UNMAPPED: the refusal of a `batch_chars` below 1,000 (exit 2, naming the field, for `create`,
  # `update` and `adopt`) is a check on an Integer the specification has no construct for;
  # `spec::check` holds it and `tests/batch_fits_model_window.rs` tests it.
  - name: cortex.instance.ModelSpec
    kind: struct
    fields:
      - {name: model, type: String}
      - {name: backend, type: Optional<cortex.instance.ModelBackend>}
      - {name: budget_usd, type: Optional<Decimal>}
      - {name: daily_ceiling_usd, type: Optional<Decimal>}
      - {name: budget_tokens, type: Optional<Integer>}
      - {name: daily_ceiling_tokens, type: Optional<Integer>}
      - {name: gateway, type: Optional<cortex.instance.ModelGateway>}
      - {name: timeout_s, type: Integer}
      - {name: instructions, type: Optional<String>}
      - {name: batch_chars, type: Optional<Integer>}

  # A model gateway the `claude` backend's calls go through, with no interactive sign-in.
  # `base_url` is the gateway's URL; `token_env` the name of the environment variable that holds
  # its token, never the token itself. The spec check refuses (exit 2, naming the field, before
  # anything is written, for `create`, `update` and `adopt` alike) a `base_url` that is empty or
  # does not start with `http://` or `https://`; a `max_context_tokens` of 0 or less; a
  # `max_output_tokens` of 0 or less, or not below `max_context_tokens` when both are given; and a
  # `token_env` that is not a variable name (letters, digits and `_`, not starting with a digit),
  # that a unit cortex writes holds by value (`PATH`, `HOME`, every `CONNECTORS_*` and `CORTEX_*`),
  # or that is any `XDG_*` or `ANTHROPIC_*` name.
  # UNMAPPED: these refusals are checks on String and Integer values the specification has no
  # construct for; `spec::check` holds them and `tests/security_20261015c.rs` tests them.
  # cortex passes exactly this set to `claude`:
  # `ANTHROPIC_BASE_URL` (`base_url`), `ANTHROPIC_AUTH_TOKEN` (the value of `token_env`, read
  # when the call is made), `CLAUDE_CODE_MAX_CONTEXT_TOKENS` (`max_context_tokens`, when given)
  # and `CLAUDE_CODE_MAX_OUTPUT_TOKENS` (`max_output_tokens`, when given), from an interactive run, a timer unit and a runner that calls `cortex run` alike. A
  # missing or empty `token_env` fails the call before `claude` starts, with a reason naming the
  # variable. Without a gateway, `ANTHROPIC_BASE_URL` and `ANTHROPIC_AUTH_TOKEN` are removed from
  # `claude`'s environment, so no instance reaches a gateway by accident; `ANTHROPIC_API_KEY` is
  # removed always. A unit file cortex writes names `token_env`, never its value. The model is
  # named by `model`, passed as `--model`. Behind a gateway the instance is bounded in tokens only
  # (`cortex.instance.ModelSpec`): `model.budget_tokens` is required, `model.budget_usd` may be
  # omitted, and no dollar limit counts the cost `claude` reports.
  - name: cortex.instance.ModelGateway
    kind: struct
    fields:
      - {name: base_url, type: String}
      - {name: token_env, type: String}
      - {name: max_context_tokens, type: Optional<Integer>}
      - {name: max_output_tokens, type: Optional<Integer>}

  # The spend of the day of one instance: `spend.json` in the instance directory, `format`
  # `cortex.daily-spend/1`. `day` is the UTC calendar day it counts, `YYYY-MM-DD`; `spent_usd` the
  # sum of the costs of the model answers of that day that stated one. A day starts at 00:00 UTC:
  # a file whose `day` is not today's counts as nothing spent, and the next costed answer starts it
  # again. Every costed answer is added under the home's lock as soon as it is read, failed answers
  # included; an answer with no cost adds nothing. The file is kept whether or not the spec names a
  # ceiling, and a snapshot restore leaves it as it is. `spent_tokens` sums, the same way, the
  # tokens the day's answers reported in their `usage` (input, cache reads, cache writes and
  # output); an answer whose tokens could not be counted (`cortex.instance.ModelSpec`: no `usage`,
  # a count below 0, or a sum past a signed 64-bit integer) adds nothing, and a file written
  # before it was counted reads as `0`. A day's sum that would pass a signed 64-bit integer is not
  # recorded: as for any spend that could not be recorded, a ceiling then allows no further call.
  # `uncounted_usd` sums, the same way, the costs the day's answers reported behind a model gateway
  # (`cortex.instance.ModelSpec.gateway`), as reported; they count against no dollar limit and add
  # nothing to `spent_usd`. It is written from the day's first such answer and kept with the day.
  - name: cortex.instance.DailySpend
    kind: struct
    fields:
      - {name: format, type: String}
      - {name: day, type: String}
      - {name: spent_usd, type: Decimal}
      - {name: spent_tokens, type: Optional<Integer>}
      - {name: uncounted_usd, type: Optional<Decimal>}

  - name: cortex.instance.SqliteStore
    kind: struct
    fields:
      - {name: path, type: Optional<String>}

  # A saved Connectors connection whose document a launched `ekr` reads on descriptor 3
  # (`connectors connections launch --consumer ekr`); cortex names it and never reads it.
  #
  # A connection is named by id (`connection: conn_…`) or by profile (`profile: <profile>`),
  # exactly one of the two. ESS types no field that is a string or an object (a union is always
  # tagged), so the profile form is a `profile` field beside an optional `connection`, here and on
  # the three source settings, whose `adapter` is the source's own. A profile is resolved each
  # time cortex needs the connection, never stored: to the one connection that
  # `connectors connections list --adapter <adapter>` (its first page) lists with that `profile`
  # and a `state` other than `revoked`. None, or more than one, is refused with a reason naming
  # the adapter, the profile, the count and every matching id. The one place a resolved id is
  # written down is the viewer's systemd unit, which launches through the id the profile resolved
  # to at the last `create`, `adopt` or `update`: `update` resolves the profile again and rewrites
  # the unit when that id changed, so an update after a reconnect points the viewer at the live
  # connection.
  - name: cortex.instance.ConnectionRef
    kind: struct
    fields:
      - {name: adapter, type: String}
      - {name: connection, type: Optional<String>}
      - {name: profile, type: Optional<String>}
    # UNMAPPED: not both `connection` and `profile`: conformance synthesis witnesses every
    # Optional as present, so that invariant leaves no spec it can build; `spec::check` refuses it.
    invariants:
      - any:
          - defined(connection)
          - defined(profile)

  # With `connection`, every `ekr` of the store starts through `connectors connections launch`,
  # and `config` must name `password_file`; `schema_connection` does the same for
  # `--postgres-schema-config`. Without `connection`, `ekr` starts directly, as before.
  - name: cortex.instance.PostgresStore
    kind: struct
    fields:
      - {name: config, type: String}
      - {name: connection, type: Optional<cortex.instance.ConnectionRef>}
      - {name: schema_connection, type: Optional<cortex.instance.ConnectionRef>}

  - name: cortex.instance.StoreSpec
    kind: union
    tag: backend
    variants:
      sqlite: Optional<cortex.instance.SqliteStore>
      postgres: cortex.instance.PostgresStore

  - name: cortex.instance.RedactionClass
    kind: enum
    variants: [Email, Phone, IpAddress, PaymentCard, Url, Credential, RareName]

  - name: cortex.instance.RedactionRule
    kind: struct
    fields:
      - {name: name, type: String}
      - {name: pattern, type: String}
      - {name: replacement, type: String}

  # `RareName` replaces a capitalised word (one capital and at least one lower-case letter) that
  # the batch's document texts hold at most `rare_limit` times (default 1). A word, hyphenated or
  # not (`Jean-Luc`, `Co-Authored-By`), is replaced whole or not at all: no part of a word seen
  # more than `rare_limit` times is a rare name, and the `refuse_if_left` check reads words the
  # same way, so it finds nothing left of a word that was kept. A word glued directly to a
  # lower-case letter before it (`useFoo-Bar`) is part of an identifier and skipped whole. A word
  # after one or more underscores is part of an identifier only when the run of letters and digits
  # directly before those underscores begins with a lower-case letter (`snake_case_Identifier`,
  # `x__Quill`); otherwise the underscores bound it, as a space does (`_Rowan_`, `CV_Rowan`,
  # `2024_Quill`, the `Quill` of `Rowan_Quill`). A letter of a script without case bounds a word
  # too (the `Rowan` of `会议上Rowan发言了`); a Latin letter without case (`ǀ`, `ʔ`) is part of
  # it (`Nǀaqriaq`). The part of a word before a span another class hides (`Schmidt` of
  # `Schmidt-Müller`, `Müller` a known name) is read alone, as the check reads it beside that
  # span's placeholder, and replaced when it is rare. A text cut at `max_chars` inside a word kept
  # whole ends in a prefix of that word, which the check does not read as a rare name.
  # UNMAPPED: how a text splits into words and how often a batch holds each is a rule on String
  # values the specification has no construct for; `src/redact.rs` holds it and its tests and
  # `tests/redaction_gate.rs` test it.
  - name: cortex.instance.RedactionPolicy
    kind: struct
    fields:
      - {name: classes, type: List<cortex.instance.RedactionClass>}
      - {name: rules, type: List<cortex.instance.RedactionRule>}
      - {name: known_names, type: Optional<List<String>>}
      - {name: rare_limit, type: Optional<Integer>}
      - {name: refuse_if_left, type: Optional<List<cortex.instance.RedactionClass>>}

  # One check of the run gate (`cortex.instance.RunGate`): `measure` names a number of the run's
  # report (`documents_new`, `documents_applied`, `facts_refused`, `parts_rejected`, `masked`,
  # `truncated`, `unrestored`, `cost_usd`) or, by its dotted path, of the store's quality document,
  # held to `min`, `max` or both. Behind a model gateway, where a run's cost is not counted
  # (`cortex.instance.SourceRan.cost_counted` false), a `cost_usd` check checks nothing: the
  # reported cost bounds nothing, and `create`, `update` and `adopt` name such a check in the line
  # that says the dollar limits bound nothing (`cortex.instance.ModelSpec`).
  - name: cortex.instance.GateCheck
    kind: struct
    fields:
      - {name: measure, type: String}
      - {name: min, type: Optional<Decimal>}
      - {name: max, type: Optional<Decimal>}

  - name: cortex.instance.RunGate
    kind: struct
    fields:
      - {name: checks, type: List<cortex.instance.GateCheck>}

  - name: cortex.instance.SnapshotPolicy
    kind: struct
    fields:
      - {name: keep, type: Integer}

  - name: cortex.instance.EkrPin
    kind: struct
    fields:
      - {name: version, type: String}
      - {name: bin, type: Optional<String>}

  - name: cortex.instance.ServeSpec
    kind: struct
    fields:
      - {name: view_port, type: Optional<Integer>}

  # The outcome of a source's last run, as `cortex run` printed it: what a source's status
  # (`cortex sources`) and the metric file report.
  - name: cortex.instance.RunOutcome
    kind: enum
    variants: [ran, fetch-failed, extraction-failed, apply-refused, store-outcome-unknown, connection-unavailable, batch-too-large, terminated, model-unavailable, disabled]

  # Why a run's model could not be reached (`cortex.instance.ModelUnavailable`): `refused`, the
  # model process could not be started or its connection was refused; `not-loaded`, the server
  # behind the gateway answered that the model is not loaded or still loading; `gateway-down`,
  # the gateway or the API answered HTTP 502, 503 or 504.
  - name: cortex.instance.ModelUnavailableCause
    kind: enum
    variants: [refused, not-loaded, gateway-down]

  # A command cortex calls once for each run of a source that answers `fetch-failed`,
  # `extraction-failed`, `apply-refused`, `store-outcome-unknown`, `connection-unavailable`,
  # `batch-too-large`, `terminated` or `model-unavailable`:
  # `command` is its argument vector (no shell), started in
  # the instance directory, in a process group of its own, with the source id and the outcome
  # appended as its last two arguments. A relative program path holding a `/` is read against the
  # spec file's directory, as seed paths are; a bare name is looked up on `PATH`. The outcome is
  # `disabled` when the run's recorded failure disabled the source. It holds no secret: one the
  # hook needs it reads itself, outside cortex. The call lasts `timeout_s` seconds at most, absent
  # means 10; then the hook's process group is killed.
  - name: cortex.instance.RunHook
    kind: struct
    fields:
      - {name: command, type: List<String>}
      - {name: timeout_s, type: Optional<Integer>}

  # What became of a hook call, as `cortex.log` records it beside the source and the outcome:
  # `called` when it exited 0, `failed` when it could not start or exited otherwise, `timed-out`
  # when it was killed at its timeout. Neither changes the run's outcome or its exit status.
  - name: cortex.instance.HookResult
    kind: enum
    variants: [called, failed, timed-out]

  # Where a run reports besides its printed line, `cortex.log` and the source's status. With
  # `metrics: true`, every run of a source rewrites `metrics.prom` in the instance directory whole
  # (a temporary file, then a rename), in the Prometheus text format, for a textfile collector or a
  # sidecar; cortex serves no port. It holds, per source:
  # - `cortex_source_runs_total{source, outcome}` (counter), the runs by outcome;
  # - `cortex_source_last_run_timestamp_seconds{source}` (gauge), when the last run started;
  # - `cortex_source_last_run_duration_seconds{source}` (gauge), how long it took, to the moment
  #   it recorded its outcome;
  # - `cortex_source_last_run_documents{source, kind}` (gauge), the last run's documents: `read`,
  #   the new or changed documents it selected to extract (`SourceRan.documents_new`), and
  #   `applied` (`SourceRan.documents_applied`); present only when the last run ended `ran`;
  # - `cortex_source_documents_total{source, kind}` (counter), the same, added up over every run
  #   that ended `ran`;
  # - `cortex_source_model_tokens_total{source, kind}` (counter), the model tokens those runs
  #   reported: `input` (`input_tokens` and `cache_creation_input_tokens`), `cached`
  #   (`cache_read_input_tokens`) and `output` (`output_tokens`); a run whose answers did not
  #   report a count adds nothing to it.
  # Every label is the source id or a fixed name: no series holds a credential, a prompt, a
  # question or document content. A source's status file (`status/<source>.json`) keeps these
  # figures, so the whole file is rewritten from the status files. A metric file cortex cannot
  # write is recorded in `cortex.log` and changes no run's outcome.
  - name: cortex.instance.MonitoringSpec
    kind: struct
    fields:
      - {name: metrics, type: Optional<Boolean>}
      - {name: hook, type: Optional<cortex.instance.RunHook>}

  - name: cortex.instance.InstanceSpec
    kind: struct
    fields:
      - {name: format, type: String}
      - {name: name, type: cortex.instance.InstanceName}
      - {name: description, type: String}
      - {name: ekr, type: cortex.instance.EkrPin}
      - {name: seed, type: cortex.instance.SeedSpec}
      - {name: model, type: cortex.instance.ModelSpec}
      - {name: sources, type: List<cortex.instance.SourceSpec>}
      - {name: serve, type: cortex.instance.ServeSpec}
      - {name: store, type: Optional<cortex.instance.StoreSpec>}
      - {name: redaction, type: Optional<cortex.instance.RedactionPolicy>}
      - {name: snapshots, type: Optional<cortex.instance.SnapshotPolicy>}
      - {name: gate, type: Optional<cortex.instance.RunGate>}
      - {name: monitoring, type: Optional<cortex.instance.MonitoringSpec>}
      - {name: ask, type: Optional<cortex.ask.AskSpec>}

  # A judge's answer on one sampled fact: `yes` when the evidence the fact cites supports it, `no`
  # when it does not, `unclear` when the judge cannot tell. EKR's `ekr.fact-judgements/1` knows only
  # `Pass` and `Fail`: `yes` is `Pass`, `no` and `unclear` are `Fail`.
  - name: cortex.instance.QualityVerdictKind
    kind: enum
    variants: [yes, no, unclear]

  # One line of `quality/<stamp>/verdicts.jsonl`, `format` `cortex.quality-verdict/1`: the EKR
  # assertion id of the sampled fact, the judge's verdict and its reason.
  - name: cortex.instance.QualityVerdict
    kind: struct
    fields:
      - {name: format, type: String}
      - {name: fact, type: String}
      - {name: verdict, type: cortex.instance.QualityVerdictKind}
      - {name: reason, type: String}

  # How `cortex eval run` answers a case's question: `mcp` asks the instance's model with the
  # store's MCP reader (`ekr mcp`) as its only tools; `ask` asks a running `cortex ask serve`;
  # `replay` takes the answers an earlier eval run recorded and asks no model.
  - name: cortex.instance.EvalRunner
    kind: enum
    variants: [mcp, ask, replay]

  # One question of an eval set, `format` `cortex.eval-case/1`. `id` is unique in its set.
  # An answer passes when it contains every `expect_facts` string (letter case and runs of white
  # space ignored) and cites every `expect_nodes` id. `source` says where the case came from, and
  # is not scored. `review_id` names the closed review item (`cortex.ask.ReviewItem`) the case was
  # made from (`cortex.instance.AddEvalCase`), and is not scored either.
  # UNMAPPED: the relation from a case to its review item is a reference from a struct in a set
  # file to an entity of another domain's store, which the specification has no construct for;
  # `src/eval.rs` holds it (one case per review item) and `tests/eval_run.rs` tests it.
  - name: cortex.instance.EvalCase
    kind: struct
    fields:
      - {name: format, type: String}
      - {name: id, type: String}
      - {name: question, type: String}
      - {name: expect_facts, type: List<String>}
      - {name: expect_nodes, type: List<String>}
      - {name: source, type: Optional<String>}
      - {name: review_id, type: Optional<cortex.ask.ReviewId>}

  # An eval set file: a JSON object whose `cases` are `cortex.eval-case/1` cases, at least one,
  # with distinct ids.
  - name: cortex.instance.EvalSet
    kind: struct
    fields:
      - {name: cases, type: List<cortex.instance.EvalCase>}

  # One line of `eval/<stamp>/results.jsonl`, `format` `cortex.eval-result/1`, in the set's order:
  # the case, the answer and the node ids it cites as the runner gave them, whether it passed, and
  # the expected fact strings it does not contain and expected node ids it does not cite. A line
  # holds nothing of the run's time or cost, so two replays of one run write the same bytes.
  - name: cortex.instance.EvalResult
    kind: struct
    fields:
      - {name: format, type: String}
      - {name: id, type: String}
      - {name: question, type: String}
      - {name: answer, type: String}
      - {name: cited_nodes, type: List<String>}
      - {name: passed, type: Boolean}
      - {name: missing_facts, type: List<String>}
      - {name: missing_nodes, type: List<String>}

  # The value kinds a schema proposal may give a property: those an extraction document writes as
  # a scalar. `NodeRef`, `Float` and `Duration` are not proposed.
  - name: cortex.instance.SchemaValueKind
    kind: enum
    variants: [String, Integer, Decimal, Boolean, Timestamp]

  - name: cortex.instance.SchemaCardinality
    kind: enum
    variants: [One, Many]

  # A property as a schema proposal declares it. cortex declares every property optional, so a
  # change never makes a node the store holds invalid.
  - name: cortex.instance.SchemaProperty
    kind: struct
    fields:
      - {name: name, type: String}
      - {name: value_kind, type: cortex.instance.SchemaValueKind}
      - {name: cardinality, type: cortex.instance.SchemaCardinality}

  # Types are named, never given by id: cortex looks each name up in the store's ontology.
  - name: cortex.instance.NewNodeType
    kind: struct
    fields:
      - {name: name, type: String}
      - {name: properties, type: List<cortex.instance.SchemaProperty>}

  - name: cortex.instance.NewEdgeType
    kind: struct
    fields:
      - {name: name, type: String}
      - {name: source_types, type: List<String>}
      - {name: target_types, type: List<String>}

  # The node types to add to an existing edge type's ends. cortex writes EKR's widening with each
  # end whole: what the end holds now plus these; an end never loses a type.
  - name: cortex.instance.EdgeTypeWidening
    kind: struct
    fields:
      - {name: name, type: String}
      - {name: add_source_types, type: List<String>}
      - {name: add_target_types, type: List<String>}

  # `owner` names a node type or an edge type.
  - name: cortex.instance.PropertyChange
    kind: struct
    fields:
      - {name: owner, type: String}
      - {name: property, type: cortex.instance.SchemaProperty}

  - name: cortex.instance.TypeRemoval
    kind: struct
    fields:
      - {name: name, type: String}

  - name: cortex.instance.PropertyRemoval
    kind: struct
    fields:
      - {name: owner, type: String}
      - {name: property, type: String}

  - name: cortex.instance.TypeMerge
    kind: struct
    fields:
      - {name: types, type: List<String>}
      - {name: into, type: String}

  - name: cortex.instance.TypeSplit
    kind: struct
    fields:
      - {name: name, type: String}
      - {name: into, type: List<String>}

  # The closed list of ontology changes a schema proposal names. EKR applies the first five
  # as schema transactions (`DefineNodeType`, `DefineEdgeType`, `ModifyProperty`,
  # `WidenEdgeType`); it removes, merges and splits nothing, so the other five are recorded for
  # review only.
  - name: cortex.instance.SchemaChange
    kind: union
    tag: kind
    variants:
      add_node_type: cortex.instance.NewNodeType
      add_edge_type: cortex.instance.NewEdgeType
      widen_edge_type: cortex.instance.EdgeTypeWidening
      add_property: cortex.instance.PropertyChange
      redeclare_property: cortex.instance.PropertyChange
      remove_node_type: cortex.instance.TypeRemoval
      remove_edge_type: cortex.instance.TypeRemoval
      remove_property: cortex.instance.PropertyRemoval
      merge_types: cortex.instance.TypeMerge
      split_type: cortex.instance.TypeSplit

  # One proposal of the model's answer: the change, why, the ids of the facts of its batch it rests
  # on, and the labels (`E1`, `E2`, …) of the batch's evidence it cites.
  - name: cortex.instance.ProposedSchemaChange
    kind: struct
    fields:
      - {name: change, type: cortex.instance.SchemaChange}
      - {name: reason, type: String}
      - {name: facts, type: List<String>}
      - {name: evidence, type: List<String>}

  # The model's whole answer for one batch; its JSON Schema is the one the answer is held to.
  - name: cortex.instance.SchemaProposals
    kind: struct
    fields:
      - {name: proposals, type: List<cortex.instance.ProposedSchemaChange>}

  # What became of a proposal: `applied` committed as a schema transaction; `refused` by EKR's
  # validation; `recorded-only` for a change EKR does not apply (remove, merge, split); `invalid`
  # when cortex cannot write it against the store's ontology: a type or property it names is not
  # there; a type it adds already is, in any case; a property it adds is one the type, a type it
  # inherits from or a type inheriting from it already declares, in any case; a property it
  # redeclares is inherited, not declared by the type it names; or a name it gives holds a
  # placeholder of the redaction policy (only `reason` is restored). `dry-run` for a change EKR
  # would be asked to apply. A review run (`--review`) records every proposal `pending`; `approve`
  # makes it `approved` and `reject` `rejected`; `apply` decides an approved one as `applied`,
  # `refused`, `recorded-only` or `invalid`, planned against the ontology at the head then.
  - name: cortex.instance.SchemaProposalStatus
    kind: enum
    variants: [pending, approved, rejected, applied, refused, recorded-only, invalid, dry-run]

  # One line of `schema/<stamp>/proposals.jsonl`, `format` `cortex.schema-proposal/1`. `facts` are
  # EKR assertion ids; `evidence` the EKR evidence ids the proposal cites and its facts cite, each
  # once. A schema transaction cites no evidence in EKR (its evidence set is held to its
  # assertions, `evidence-set-mismatch`), so this line is where an applied change's evidence is.
  # `codes` are EKR's issue codes when it refused the change; `note` says why it was refused,
  # invalid or recorded only. `revision` and `schema_version` are what an applied change committed.
  # `decision_reason` is the reason `reject` was given; `decided_by` who `approve` or `reject`
  # named (`--by`). A proposal is named by its run's stamp and its 1-based line in the file.
  # UNMAPPED: the proposal's lifecycle, `pending` to `approved` or `rejected`, and `approved` to
  # `applied`, `refused`, `recorded-only` or `invalid`, a decided proposal never decided again.
  # As an entity it cannot be stated: every transition needs a command outcome that causes it
  # (ESS-ENTITY-005), and a review run records as many proposals as the model answered, while an
  # outcome creates one instance, and `apply` takes each approved proposal to whichever of four
  # states EKR's answer for it chooses, while a set move (`instances:`) takes every row it selects
  # through one transition. `src/schema.rs` holds it, and `tests/schema_review.rs` tests it.
  - name: cortex.instance.SchemaProposal
    kind: struct
    fields:
      - {name: format, type: String}
      - {name: change, type: cortex.instance.SchemaChange}
      - {name: reason, type: String}
      - {name: facts, type: List<String>}
      - {name: evidence, type: List<String>}
      - {name: status, type: cortex.instance.SchemaProposalStatus}
      - {name: codes, type: List<String>}
      - {name: note, type: Optional<String>}
      - {name: revision, type: Optional<Integer>}
      - {name: schema_version, type: Optional<String>}
      - {name: decision_reason, type: Optional<String>}
      - {name: decided_by, type: Optional<String>}

entities:
  - name: cortex.instance.Instance
    identity:
      name: name
      type: cortex.instance.InstanceName
    fields:
      - {name: description, type: String}
      - {name: model, type: String}
      - {name: ekr_version, type: String}
      - {name: seed_digest, type: String}
    relations:
      # A source has no meaning without the instance whose store it feeds.
      - name: sources
        kind: owns
        target: cortex.instance.Source
        cardinality: many
        via: instance_name
      # The answers its ask service gave (`cortex ask serve`), kept in `ask.sqlite` in its
      # directory, never in its store.
      - name: answers
        kind: owns
        target: cortex.ask.AnswerRecord
        cardinality: many
        via: instance_name
      # An eval run is a directory of the instance's, `eval/<stamp>/`.
      - name: eval_runs
        kind: owns
        target: cortex.instance.EvalRun
        cardinality: many
        via: instance_name
    lifecycle:
      initial: Active
      # Removed keeps the instance directory and its store; only the timers and the viewer go.
      states: [Active, Removed]
      terminal: [Removed]
      transitions:
        - name: remove
          from: [Active]
          to: Removed

  - name: cortex.instance.Source
    identity:
      name: source_id
      type: cortex.instance.SourceId
    fields:
      - {name: instance_name, type: cortex.instance.InstanceName}
      - {name: name, type: String}
      - {name: kind, type: cortex.instance.SourceKind}
      - {name: schedule, type: String}
      - {name: runs, type: Integer}
      - {name: consecutive_failures, type: Integer}
      # The source's last run: its outcome, when it started and why. `ran` and `disabled` clear
      # `last_reason`; every other outcome sets it. Absent until the source first runs.
      - {name: last_outcome, type: Optional<cortex.instance.RunOutcome>}
      - {name: last_run_at, type: Optional<Timestamp>}
      - {name: last_reason, type: Optional<String>}
    relations:
      - name: seen
        kind: owns
        target: cortex.instance.SeenDocument
        cardinality: many
        via: source_id
    invariants:
      - runs >= 0
      - consecutive_failures >= 0
    lifecycle:
      initial: Enabled
      states: [Enabled, Disabled]
      terminal: []
      transitions:
        - name: disable
          from: [Enabled]
          to: Disabled
        - name: enable
          from: [Disabled]
          to: Enabled

  - name: cortex.instance.SeenDocument
    identity:
      name: document_id
      type: cortex.instance.DocumentId
    fields:
      - {name: source_id, type: cortex.instance.SourceId}
      - {name: key, type: String}
      # Absent for a document adopted by its key alone (`cortex adopt --seen`, an entry with
      # `applied_at` and no hash) until the source's next run fetches it and records its hash.
      - {name: content_hash, type: Optional<String>}
      - {name: unlinked_hash, type: Optional<String>}
      - {name: applied_at, type: Integer}
    invariants:
      - applied_at >= 0
    lifecycle:
      initial: Seen
      states: [Seen]
      terminal: [Seen]
      transitions: []

  # One eval run of an instance, `eval/<stamp>/summary.json` (`format` `cortex.eval-run/1`),
  # beside its `results.jsonl`. `cases` counts the set's cases and `passed` those that passed;
  # `cost_usd` is what its model calls cost, 0 for `replay`, absent as soon as one answer carried
  # no cost.
  # UNMAPPED: RunEval's `evaluated` records an EvalRun. One outcome does one thing to one entity,
  # and `no-such-instance` (`unknown_instance:`) needs the outcome to name the Instance, so
  # `evaluated` updates the Instance as MeasureQuality's `measured` does, and `src/eval.rs` writes
  # the run's directory; `tests/eval_run.rs` tests it.
  - name: cortex.instance.EvalRun
    identity:
      name: stamp
      type: String
    fields:
      - {name: instance_name, type: cortex.instance.InstanceName}
      - {name: runner, type: cortex.instance.EvalRunner}
      - {name: cases, type: Integer}
      - {name: passed, type: Integer}
      - {name: cost_usd, type: Optional<Decimal>}
    invariants:
      - cases >= 0
      - passed >= 0
    lifecycle:
      initial: Recorded
      states: [Recorded]
      terminal: [Recorded]
      transitions: []

actors:
  - name: cortex.instance.Operator
    may:
      - cortex.instance.CreateInstance
      - cortex.instance.AdoptInstance
      - cortex.instance.UpdateInstance
      - cortex.instance.RemoveInstance
      - cortex.instance.AddSource
      - cortex.instance.EnableSource
      - cortex.instance.RestoreSnapshot
      - cortex.instance.MeasureQuality
      - cortex.instance.RunEval
      - cortex.instance.AddEvalCase
      - cortex.instance.ProposeSchemaChanges
      - cortex.instance.ApproveSchemaProposals
      - cortex.instance.RejectSchemaProposals
      - cortex.instance.ApplySchemaProposals
    naming:
      display: Operator

  - name: cortex.instance.Scheduler
    may:
      - cortex.instance.RunSource
      - cortex.instance.RecordFailure
    naming:
      display: Scheduler

errors:
  - name: cortex.instance.ConnectionMissing
    summary: >-
      Connectors lists no live connection with the id a source or the postgres store names, or
      not exactly one live connection with the profile it names. Run
      `connectors connections connect` for it, or revoke the extra ones, then try again.
    # `connection` is the reference as the spec names it, `<adapter>:<id>` or
    # `<adapter>:profile <profile>`; `reason` names the adapter, the reference, and for a profile
    # the count of live connections listed with it and every matching id.
    fields:
      - {name: connection, type: String}
      - {name: reason, type: String}

  - name: cortex.instance.SeedRefused
    summary: EKR refused the seed or the seed schema; no store was kept.
    fields:
      - {name: reason, type: String}

  - name: cortex.instance.SeedChangeRefused
    summary: >-
      An update may change sources, model and serve settings only; the seed of an existing store
      cannot change.
    fields:
      - {name: name, type: cortex.instance.InstanceName}

  - name: cortex.instance.InstanceNotActive
    summary: The instance is removed, so nothing changed.
    fields:
      - {name: state, type: cortex.instance.Instance.State}

  - name: cortex.instance.SourceDisabledError
    summary: The source is disabled after repeated failures; enable it first.
    fields:
      - {name: source_id, type: cortex.instance.SourceId}

  - name: cortex.instance.SourceNotDisabled
    summary: The source is already enabled, so nothing changed.
    fields:
      - {name: state, type: cortex.instance.Source.State}

  - name: cortex.instance.NameTaken
    summary: The home already holds an instance with this name.
    fields:
      - {name: name, type: cortex.instance.InstanceName}

  - name: cortex.instance.BackendMismatch
    summary: >-
      The store named for adoption is not a store on the backend the spec's `store` names: no
      SQLite database for `sqlite`, or not the `ekr.postgres/1` file `store.value.config` names for
      `postgres`.
    fields:
      - {name: reason, type: String}

  - name: cortex.instance.StoreUnreadable
    summary: >-
      The store named for adoption cannot be read, or EKR cannot open it under the instance's host
      document (another tenant or authority than the store was seeded under, or no seed).
    fields:
      - {name: reason, type: String}

  - name: cortex.instance.StoreHeld
    summary: >-
      An active instance of the home, `name`, already grows this PostgreSQL lineage: the same
      `ekr.postgres/1` file and tenant.
    fields:
      - {name: name, type: String}

  - name: cortex.instance.SeedTypesMissing
    summary: >-
      A node or edge type the spec's seed declares is not in the store's ontology. `types` lists
      them, separated by a comma and a space.
    fields:
      - {name: types, type: String}

  - name: cortex.instance.InstanceNotFound
    summary: No instance has this name.
    fields:
      - {name: name, type: cortex.instance.InstanceName}

  - name: cortex.instance.SourceNotFound
    summary: No source has this id.
    fields:
      - {name: source_id, type: cortex.instance.SourceId}

  - name: cortex.instance.RestoreUnsupported
    summary: >-
      The instance's store is on the postgres backend: its snapshot is the operator's database
      backup, which cortex neither takes nor restores.
    fields:
      - {name: name, type: cortex.instance.InstanceName}

  - name: cortex.instance.InstanceBusy
    summary: >-
      Another cortex command holds the home's lock, or another connection held the store's write
      lock for 5 seconds; nothing was restored. A reader that holds the store open does not.
    fields:
      - {name: reason, type: String}

  - name: cortex.instance.SnapshotNotFound
    summary: The instance directory holds no snapshot by this name.
    fields:
      - {name: snapshot, type: String}

  - name: cortex.instance.FetchFailed
    summary: >-
      Connectors or the filesystem could not deliver the source's documents (an outage, a refused
      operation). Nothing was applied and the source's seen state did not move.
    fields:
      - {name: reason, type: String}

  - name: cortex.instance.ExtractionFailed
    summary: The model call failed or returned no valid extraction document; nothing was applied.
    fields:
      - {name: reason, type: String}

  - name: cortex.instance.ApplyRefused
    summary: EKR refused the merged extraction document; nothing was applied.
    fields:
      - {name: reason, type: String}

  - name: cortex.instance.StoreOutcomeUnknown
    summary: >-
      EKR could not say whether a store write of the run took effect (`ekr stage begin`,
      `ekr stage publish`, `ekr apply-extraction` or the settling of an earlier run's stage
      answered that the publication outcome is unknown). Nothing about the source was wrong; the
      next run settles the stage, or extracts the batch again.
    fields:
      - {name: reason, type: String}

  - name: cortex.instance.ConnectionUnavailable
    summary: >-
      Connectors answered a retryable operational failure (`kind` `operational`, `next_action`
      `retry_explicitly`) to every attempt of the run's revalidation of its connection, or of the `connections list` read that
      resolves a profile-named connection, at most 4
      attempts with pauses of 5 s, 10 s and 20 s, before the run fetched any document. Nothing about
      the source was wrong: the failure is not counted against it, and the next run starts as
      usual.
    fields:
      - {name: reason, type: String}

  - name: cortex.instance.BatchTooLarge
    summary: >-
      A part of several documents of an extraction batch was still too long for the model's
      window, or its answer still cut off at the output limit, after the batch was split 3 deep.
      Nothing about the source was wrong; a later run extracts that part, and a smaller
      `model.batch_chars` makes its batches smaller. A single document that alone does not fit is
      not this error: the run leaves it out and goes on.
    fields:
      - {name: reason, type: String}

  - name: cortex.instance.RunTerminated
    summary: >-
      The run was sent SIGTERM (a Kubernetes Job's deadline, a `systemctl stop`) before it ended,
      and stopped at the next safe point: a model call in flight was ended. A gated run is undone
      (its stage abandoned, or its kept snapshot restored); an ungated run keeps the batches it
      applied, and a later run extracts the rest. Nothing about the source was wrong: the failure
      is not counted against it.
    fields:
      - {name: reason, type: String}

  - name: cortex.instance.ModelUnavailable
    summary: >-
      The run's model could not be reached: `cause` says how (`refused`, `not-loaded`,
      `gateway-down`), and `reason` holds the model call's error text, masked for credential
      shapes and bounded, never a prompt. Nothing about the source was wrong: the failure is not
      counted against it, and the next run asks the model again.
    fields:
      - {name: cause, type: cortex.instance.ModelUnavailableCause}
      - {name: reason, type: String}

  - name: cortex.instance.SampleFailed
    summary: >-
      EKR could not draw the sample (`ekr sample`): the size is outside 1 to 1000, or the store
      cannot be read under the instance's host. No model was asked and nothing was written.
    fields:
      - {name: reason, type: String}

  - name: cortex.instance.JudgeFailed
    summary: >-
      A judge's model call failed, timed out, answered no valid verdicts or found the budget or the
      instance's daily ceiling spent, or the redaction policy refused what the judge would be shown.
      `verdicts.jsonl` keeps the verdicts of the batches judged before; no `fact-quality.json` was
      written.
    fields:
      - {name: reason, type: String}

  - name: cortex.instance.EvalSetInvalid
    summary: >-
      The eval set cannot be read, or is not a `cortex.eval-case/1` set: a case of another
      `format`, a case without an id or a question, two cases with one id, or no case; or
      `--from` is missing for `replay`, or given for another runner. No model was asked and
      nothing was written.
    fields:
      - {name: reason, type: String}

  - name: cortex.instance.EvalRunnerFailed
    summary: >-
      The runner could not answer a case: the model call failed, timed out, answered no valid
      answer or found the budget or the instance's daily ceiling spent; no `cortex ask serve`
      answered; or the run `replay` names holds no recorded answer for a case. `results.jsonl`
      keeps the results of the cases answered before; no `summary.json` was written.
    fields:
      - {name: reason, type: String}

  - name: cortex.instance.EvalReviewNotFound
    summary: >-
      The instance's answer records hold no review item with this id, or not the answer record
      it belongs to (a purge took them); no case was added.
    fields:
      - {name: review_id, type: cortex.ask.ReviewId}

  - name: cortex.instance.EvalReviewOpen
    summary: >-
      The review item is still open: its expected facts and nodes are written when a reviewer
      closes it, so it yields no case yet.
    fields:
      - {name: review_id, type: cortex.ask.ReviewId}

  - name: cortex.instance.EvalNoExpectations
    summary: >-
      The review item is closed but its reviewer wrote no expected fact and no expected node (an
      item closed before the answer records held expectations has none): a case with nothing
      expected passes every answer, so no case was added.
    fields:
      - {name: review_id, type: cortex.ask.ReviewId}

  - name: cortex.instance.EvalCaseExists
    summary: >-
      The set already holds the case of this review item, or a case with its id; one review item
      yields one case in a set.
    fields:
      - {name: review_id, type: cortex.ask.ReviewId}

  - name: cortex.instance.ProposeFailed
    summary: >-
      A model call for schema proposals failed, timed out, answered no valid proposals or found the
      budget or the instance's daily ceiling spent, the redaction policy refused what the model
      would be shown, or EKR could not read the store's ontology. Nothing was applied and no `proposals.jsonl` was written.
    fields:
      - {name: reason, type: String}

  - name: cortex.instance.SchemaRunNotFound
    summary: >-
      The instance has no schema run by this stamp: no `schema/<stamp>/proposals.jsonl`, or one
      that cannot be read.
    fields:
      - {name: stamp, type: String}
      - {name: reason, type: String}

  - name: cortex.instance.SchemaProposalsNotPending
    summary: >-
      `approve` or `reject` named a proposal the run does not have or that is already decided, or
      the run has no pending proposal left. A decided proposal is not decided again; nothing
      changed.
    fields:
      - {name: reason, type: String}

  - name: cortex.instance.SchemaProposalsNotApproved
    summary: >-
      `apply` found no approved proposal in the run: none was approved, or every approved one is
      applied or decided. Nothing was applied.
    fields:
      - {name: reason, type: String}

  - name: cortex.instance.SchemaGateFailed
    summary: >-
      The applied schema changes failed the spec's `gate`. Nothing was published: the stage was
      abandoned, or on `sqlite` the snapshot taken before was restored; every approved proposal is
      still `approved`.
    fields:
      - {name: reason, type: String}

  - name: cortex.instance.SchemaApplyFailed
    summary: >-
      EKR could not read the ontology, begin the stage, take the snapshot, mint an id or answer
      a transaction. Nothing was published: the stage was abandoned, or on `sqlite` the snapshot
      taken before was restored; every approved proposal is still `approved`.
    fields:
      - {name: reason, type: String}

commands:
  - name: cortex.instance.AdoptInstance
    naming:
      wire: adopt
      display: Adopt an existing store
    # As for CreateInstance, the command line reads the spec file; `store` is `--store`. Each
    # source's seen documents start from the `cortex.seen/1` file `--seen` names for it, or empty.
    # An entry of that file names a key and its `applied_at`, with or without a hash; one with no
    # `applied_at` (missing or null), or whose fields are not of their types (`applied_at` an
    # integer, `hash` a string or null), is refused, naming its key. An entry with no hash is a
    # SeenDocument with no `content_hash`, which the source's next run records (see RunSource's
    # `ran`). A key is the one cortex gives the document: for a files source, the file's absolute
    # path (a record's followed by `#<id>`); a relative path matches no document.
    input:
      - {name: name, type: cortex.instance.InstanceName}
      - {name: description, type: String}
      - {name: model, type: String}
      - {name: ekr_version, type: String}
      - {name: seed_digest, type: String}
      - {name: spec, type: cortex.instance.InstanceSpec}
      - {name: store, type: String}
    outcomes:
      - name: name-taken
        existing_instance: true
        error: cortex.instance.NameTaken
        payload:
          cortex.instance.NameTaken:
            name: input.name
        summary: Nothing was adopted.

      - name: backend-mismatch
        external: The store is not on the backend the spec's store names, or not the postgres configuration it names
        error: cortex.instance.BackendMismatch
        payload:
          cortex.instance.BackendMismatch:
            reason: {generated: true}
        summary: Nothing was adopted.

      - name: store-unreadable
        external: The store cannot be read, or EKR cannot open it under the instance's host document
        error: cortex.instance.StoreUnreadable
        payload:
          cortex.instance.StoreUnreadable:
            reason: {generated: true}
        summary: Nothing was adopted.

      - name: store-held
        external: An active instance of the home already grows the PostgreSQL lineage, the same configuration and tenant
        error: cortex.instance.StoreHeld
        payload:
          cortex.instance.StoreHeld:
            name: {generated: true}
        summary: Nothing was adopted.

      - name: seed-types-missing
        external: A node or edge type of the spec's seed is not in the store's ontology
        error: cortex.instance.SeedTypesMissing
        payload:
          cortex.instance.SeedTypesMissing:
            types: {generated: true}
        summary: Nothing was adopted.

      - name: adopted
        creates: cortex.instance.Instance
        instance: name
        sets:
          description: input.description
          model: input.model
          ekr_version: input.ekr_version
          seed_digest: input.seed_digest
        emits:
          - cortex.instance.InstanceAdopted
        payload:
          cortex.instance.InstanceAdopted:
            name: input.name
            revision: {generated: true}
            view_port: {generated: true}
        summary: >-
          The store answers the head it had, `revision`; nothing was seeded, extracted or written
          to it. A SQLite store was copied into the instance directory, which grows the copy; a
          PostgreSQL store is used where it is. The sources are added by AddSource, one per source
          in the spec.

  - name: cortex.instance.CreateInstance
    naming:
      wire: create
      display: Create an instance
    # The command line reads the spec file; `name`, `description`, `model`, `ekr_version` and
    # `seed_digest` are its values, carried as top-level inputs because an outcome reads only
    # top-level input fields.
    input:
      - {name: name, type: cortex.instance.InstanceName}
      - {name: description, type: String}
      - {name: model, type: String}
      - {name: ekr_version, type: String}
      - {name: seed_digest, type: String}
      - {name: spec, type: cortex.instance.InstanceSpec}
    outcomes:
      - name: name-taken
        existing_instance: true
        error: cortex.instance.NameTaken
        payload:
          cortex.instance.NameTaken:
            name: input.name
        summary: Nothing was created.

      - name: connection-missing
        external: >-
          Connectors lists no live connection for a connection id a source or the postgres store
          of the spec names, or not exactly one live connection for a profile one names
        error: cortex.instance.ConnectionMissing
        payload:
          cortex.instance.ConnectionMissing:
            connection: {generated: true}
            reason: {generated: true}
        summary: Nothing was created.

      - name: seed-refused
        external: EKR refuses the minimal seed, the ekr-seed/2 file or the seed schema document
        error: cortex.instance.SeedRefused
        payload:
          cortex.instance.SeedRefused:
            reason: {generated: true}
        summary: Nothing was created.

      - name: partial
        external: >-
          The seed extraction stops before every seed document is extracted: the budget is spent,
          or a model call or an apply fails
        creates: cortex.instance.Instance
        instance: name
        sets:
          description: input.description
          model: input.model
          ekr_version: input.ekr_version
          seed_digest: input.seed_digest
        emits:
          - cortex.instance.InstanceCreated
        payload:
          cortex.instance.InstanceCreated:
            name: input.name
            view_port: {generated: true}
        summary: >-
          As `created`, but some seed documents were not extracted. They are not recorded as seen,
          so `cortex run <name>/seed` extracts them.

      - name: created
        creates: cortex.instance.Instance
        instance: name
        sets:
          description: input.description
          model: input.model
          ekr_version: input.ekr_version
          seed_digest: input.seed_digest
        emits:
          - cortex.instance.InstanceCreated
        payload:
          cortex.instance.InstanceCreated:
            name: input.name
            view_port: {generated: true}
        summary: >-
          The store is seeded, the seed schema applied and the seed documents extracted into it.
          The viewer runs on its port. The sources are added by AddSource, one per source in the spec.

  - name: cortex.instance.UpdateInstance
    naming:
      wire: update
      display: Update an instance
    input:
      - {name: name, type: cortex.instance.InstanceName}
      - {name: description, type: String}
      - {name: model, type: String}
      - {name: spec, type: cortex.instance.InstanceSpec}
      - {name: seed_digest, type: String}
    outcomes:
      - name: seed-change-refused
        when_subject:
          predicate: seed_digest != input.seed_digest
        error: cortex.instance.SeedChangeRefused
        payload:
          cortex.instance.SeedChangeRefused:
            name: input.name
        summary: Nothing changed.

      - name: not-active
        when_subject:
          predicate: state == Removed
        error: cortex.instance.InstanceNotActive
        payload:
          cortex.instance.InstanceNotActive:
            state: {generated: true}
        summary: The instance is removed; nothing changed.

      - name: updated
        updates: cortex.instance.Instance
        instance: name
        sets:
          description: input.description
          model: input.model
        emits:
          - cortex.instance.InstanceUpdated
        payload:
          cortex.instance.InstanceUpdated:
            name: input.name
        summary: >-
          The frozen spec is replaced; sources, model and serve settings take effect on the next run.
          The viewer unit holds the connection id resolved at the last create, adopt or update: it is
          rewritten when the store's connection changed, or when its profile now resolves to
          another id.

      - name: no-such-instance
        unknown_instance: true
        error: cortex.instance.InstanceNotFound
        payload:
          cortex.instance.InstanceNotFound:
            name: input.name
        summary: Nothing changed.

  - name: cortex.instance.RemoveInstance
    naming:
      wire: remove
      display: Remove an instance
    input:
      - {name: name, type: cortex.instance.InstanceName}
    outcomes:
      - name: removed
        moves: cortex.instance.Instance.remove
        instance: name
        emits:
          - cortex.instance.InstanceRemoved
        payload:
          cortex.instance.InstanceRemoved:
            name: input.name
        summary: The timers and the viewer are gone; the directory and the store stay.

      - name: wrong-state
        wrong_state: true
        error: cortex.instance.InstanceNotActive
        payload:
          cortex.instance.InstanceNotActive:
            state: {generated: true}
        summary: The instance was already removed.

      - name: no-such-instance
        unknown_instance: true
        error: cortex.instance.InstanceNotFound
        payload:
          cortex.instance.InstanceNotFound:
            name: input.name
        summary: Nothing changed.

  - name: cortex.instance.AddSource
    naming:
      wire: add
      display: Add a source
    input:
      - {name: instance_name, type: cortex.instance.InstanceName}
      - {name: source_id, type: cortex.instance.SourceId}
      - {name: name, type: String}
      - {name: kind, type: cortex.instance.SourceKind}
      - {name: schedule, type: String}
    outcomes:
      - name: added
        creates: cortex.instance.Source
        instance: source_id
        sets:
          instance_name: input.instance_name
          name: input.name
          kind: input.kind
          schedule: input.schedule
          runs: 0
          consecutive_failures: 0
        emits:
          - cortex.instance.SourceAdded
        payload:
          cortex.instance.SourceAdded:
            source_id: input.source_id
            instance_name: input.instance_name
        summary: The source's timer is installed and enabled.

  - name: cortex.instance.RunSource
    naming:
      wire: run
      display: Run a source once
    input:
      - {name: source_id, type: cortex.instance.SourceId}
      - {name: fetch_only, type: Optional<Boolean>}
    outcomes:
      # UNMAPPED: the exit status of each outcome, which an external scheduler reads instead of
      # the printed line: `ran` 0; `fetch-failed`, `extraction-failed`, `apply-refused` and
      # `no-such-source` 1; `disabled` 3; `store-outcome-unknown` 4; `connection-unavailable` 5; `batch-too-large` 6;
      # `model-unavailable` 7; `terminated` 8; and 2 for an error before any outcome. ESS declares no exit status for a
      # command line's outcomes; tests/e2e.rs, tests/run_status.rs, tests/store_outcome_unknown.rs,
      # tests/connections_revalidate_retry.rs, tests/run_metrics.rs and
      # tests/model_unavailable.rs hold it.
      # UNMAPPED: `<instance>/seed`, when the instance is active and has no source named `seed`,
      # names the instance's seed documents: it extracts those no seed extraction applied yet (what
      # a `partial` create left) and answers these outcomes with no Source to update. Like a source
      # run it keeps a snapshot before it applies and is held to the spec's `gate`; on an adopted
      # instance it answers `fetch-failed`, since the seed belongs to the store's earlier life. ESS
      # has no input that names either a record or a pseudo-record; tests/seed_partial.rs and
      # tests/adversary_seed_partial.rs hold it.
      # UNMAPPED: `ran` records a SeenDocument of the source (content hash, time applied) for every
      # document it applied, and a run extracts only documents whose key no SeenDocument of the
      # source carries, or whose hash differs once `refresh_after_days` have passed. A structured
      # source's change record that holds links also records `unlinked_hash`, the hash of its text
      # without them; a change whose text differs from the one applied only in its links is
      # extracted at once, without waiting for `refresh_after_days`. A SeenDocument with no
      # `content_hash` (adopted by key) is not extracted: the first run that fetches a document
      # under its key records the hash of that document as the run renders and masks it, keeps its
      # `applied_at`, and counts it as `hashed` in the run's report, not in `documents_new`; a
      # later run extracts it when that hash changes. A key the run does not fetch keeps no hash.
      # The hash is written to the state with the rest of the run, so a run that is undone (its
      # gate failed) puts it back with `state/`, and the next run records it again. ESS has no
      # effect that creates or updates one record per element of a collection (`instances:` is
      # refused on `creates:`, `affects:` only updates), so the per-source state file holds it and
      # the Rust tests check it (a second run over unchanged input applies nothing). beyond10x/ess#459.
      # UNMAPPED: after every outcome that names a source, the instance's `monitoring` reports it:
      # `metrics.prom` is rewritten with the source's run counted under its outcome, its duration,
      # and for `ran` its documents and model tokens (`cortex.instance.MonitoringSpec`), and for
      # `fetch-failed`, `extraction-failed`, `apply-refused`, `store-outcome-unknown`,
      # `connection-unavailable`, `batch-too-large`, `terminated` and `model-unavailable` the hook
      # is called once, with
      # `disabled` instead when the recorded failure disabled the source. ESS declares no effect
      # outside the model's records and no metric; tests/run_status.rs,
      # tests/store_outcome_unknown.rs, tests/connections_revalidate_retry.rs and
      # tests/run_metrics.rs hold it.
      # UNMAPPED: with `fetch_only` (`cortex run --fetch-only`), `fetched` exits 0 and
      # `fetch-only-failed` exits 1 and prints `fetch-failed`. Neither writes the source's status
      # file, `metrics.prom`, `cortex.log`, the seen documents or the window (`pending_since`),
      # calls the hook, takes the home's snapshot or an EKR stage, or reads the store; the counts
      # compare each fetched document with the source's SeenDocuments, which ESS cannot state per
      # element (beyond10x/ess#459). A disabled source is counted too, as `fetched`: a held-state
      # refusal beside `fetched` has no witness ESS 0.59.0 synthesizes. `<instance>/seed` with
      # `fetch_only` answers `fetch-only-failed`: its documents are not a source's. tests/e2e.rs
      # holds it.
      # Not a refusal: a run of a disabled source changes the source's status, which a refusal
      # may not. It answers no error, so the printed line and the exit status say it.
      - name: disabled
        when_subject_state: Disabled
        when: {any: ["not defined(fetch_only)", fetch_only == false]}
        updates: cortex.instance.Source
        instance: source_id
        sets:
          last_outcome: disabled
          last_run_at: {generated: true}
          last_reason: {cleared: true}
        emits:
          - cortex.instance.RunSkipped
        payload:
          cortex.instance.RunSkipped:
            source_id: input.source_id
        summary: >-
          The source is disabled: nothing ran and nothing was counted, and the source's status
          records the outcome.

      - name: fetch-only-failed
        external: Connectors or the filesystem fails to deliver the source's documents in a fetch-only run
        when: {all: ["defined(fetch_only)", fetch_only == true]}
        error: cortex.instance.FetchFailed
        payload:
          cortex.instance.FetchFailed:
            reason: {generated: true}
        summary: >-
          Nothing was written: not the source's status, its seen documents or its window, and no
          failure is counted. The command line prints it as `fetch-failed`.

      - name: fetched
        when: {all: ["defined(fetch_only)", fetch_only == true]}
        updates: cortex.instance.Source
        instance: source_id
        emits:
          - cortex.instance.SourceFetched
        payload:
          cortex.instance.SourceFetched:
            source_id: input.source_id
            since: {generated: true}
            until: {generated: true}
            fetched: {generated: true}
            new: {generated: true}
            changed: {generated: true}
            held: {generated: true}
            unchanged: {generated: true}
            unread: {generated: true}
        summary: >-
          A fetch-only run: the source was fetched over the window a run would ask about, its
          documents masked and scrubbed as a run's are and compared with its seen documents by
          content hash. `new` counts keys no seen document carries; `changed` those a run would
          extract now; `held` those whose change `refresh_after_days` holds back; `unchanged` the
          rest. No model was asked, and nothing was written: not the store, the seen documents,
          the source's status or `cortex.log`; no snapshot or stage was taken and no run counted.

      - name: fetch-failed
        external: Connectors or the filesystem fails to deliver the source's documents; an invocation Connectors refuses with timeout at admission is retried once first
        error: cortex.instance.FetchFailed
        compensates: true
        updates: cortex.instance.Source
        instance: source_id
        sets:
          last_outcome: fetch-failed
          last_run_at: {generated: true}
          last_reason: {generated: true}
        payload:
          cortex.instance.FetchFailed:
            reason: {generated: true}
        summary: >-
          Nothing was applied; the source's status records the outcome and its reason, and the
          scheduler then sends RecordFailure.

      - name: extraction-failed
        external: The model call fails (other than as `model-unavailable` says), times out, exceeds the run budget before any batch, or returns no valid document; an error answer that cost zero is asked once more first, after a fixed wait
        error: cortex.instance.ExtractionFailed
        compensates: true
        updates: cortex.instance.Source
        instance: source_id
        sets:
          last_outcome: extraction-failed
          last_run_at: {generated: true}
          last_reason: {generated: true}
        payload:
          cortex.instance.ExtractionFailed:
            reason: {generated: true}
        summary: >-
          Nothing was applied; the source's status records the outcome and its reason, and the
          scheduler then sends RecordFailure. When the model answered an error, `reason` holds the
          error text it gave, masked for credential shapes as fetched text is and cut at a
          character boundary to a bound, and the batch's `claude/error.txt` holds the same text.
          An error answer with a cost above zero, or with no cost reported, is not asked again.

      - name: apply-refused
        external: EKR refuses the merged extraction document
        error: cortex.instance.ApplyRefused
        compensates: true
        updates: cortex.instance.Source
        instance: source_id
        sets:
          last_outcome: apply-refused
          last_run_at: {generated: true}
          last_reason: {generated: true}
        payload:
          cortex.instance.ApplyRefused:
            reason: {generated: true}
        summary: >-
          Nothing was applied; the source's status records the outcome and its reason, and the
          scheduler then sends RecordFailure.

      # UNMAPPED: what the run leaves for the next one. An unknown outcome at `stage begin` leaves
      # a stage EKR may hold as begun, which the next run abandons; at `stage publish` the run
      # keeps `stage.json` with `publishing` set and neither puts `state/` back nor abandons the
      # stage, so the next run completes the publish at the same head. At `apply-extraction`
      # inside a stage the run leaves the stage, which the next run abandons, putting `state/`
      # back; on a gated `sqlite` run that kept its snapshot (an earlier batch committed) the run
      # restores that snapshot and puts `state/` back, as a run its gate refuses is undone, and
      # says so in its report and `cortex.log`; outside a stage with no gate the run marks no
      # document of the unknown batch, or of any later one, as seen, so the next run extracts that
      # batch again: nothing is lost, and a batch that did land is written a second time, as any
      # re-extraction writes a second set of assertions and evidence. ESS declares no
      # effect on files outside the model's records; tests/store_outcome_unknown.rs holds it.
      - name: store-outcome-unknown
        external: >-
          EKR answers that the publication outcome of a store write of the run (a stage verb or
          `apply-extraction`) is unknown
        error: cortex.instance.StoreOutcomeUnknown
        compensates: true
        updates: cortex.instance.Source
        instance: source_id
        sets:
          last_outcome: store-outcome-unknown
          last_run_at: {generated: true}
          last_reason: {generated: true}
        payload:
          cortex.instance.StoreOutcomeUnknown:
            reason: {generated: true}
        summary: >-
          The source's status records the outcome and its reason, and the scheduler sends no
          RecordFailure: the store, not the source, failed, so the failure is not counted and
          never disables the source. The next run settles the stage; a gated `sqlite` run that kept
          a snapshot is undone from it; otherwise the next run extracts the batch whose apply was
          unknown again.

      # UNMAPPED: the bound of the retry. Before a Connectors read, cortex lists the connection and
      # revalidates it when it is not `ready`; an answer to either that Connectors marks retryable
      # (`error.data.kind` `operational` with `next_action` `retry_explicitly`, such as
      # `unavailable` at `dispatch`) is tried again, at most `CORTEX_REVALIDATE_ATTEMPTS` attempts
      # in all (4), pausing `CORTEX_REVALIDATE_PAUSE_MS` (5000) before the second and doubling
      # after it (5 s, 10 s, 20 s). A refusal (a missing, revoked or not-granted connection, an
      # authentication or scope failure) is not retried. A revalidation still failing after the
      # run fetched documents (a lapse renewed mid-run) is retried the same way and then answers
      # `fetch-failed`. ESS has no retry or backoff construct;
      # tests/connections_revalidate_retry.rs holds it.
      - name: connection-unavailable
        external: >-
          Connectors answers a retryable operational failure to every attempt of `connections
          revalidate` (or of the `connections list` read before it, which for a source naming a profile is
          also the read that resolves the profile) before the run's first fetch
        error: cortex.instance.ConnectionUnavailable
        compensates: true
        updates: cortex.instance.Source
        instance: source_id
        sets:
          last_outcome: connection-unavailable
          last_run_at: {generated: true}
          last_reason: {generated: true}
        payload:
          cortex.instance.ConnectionUnavailable:
            reason: {generated: true}
        summary: >-
          Nothing was fetched or applied; the source's status records the outcome and its reason,
          naming the last error, and the scheduler sends no RecordFailure: Connectors, not the
          source, failed, so the failure is not counted and never disables the source. The next
          scheduled run starts as usual.

      # UNMAPPED: `batch-too-large` exits 6, and like `store-outcome-unknown` its status, metric
      # and hook report it while the scheduler counts nothing. What the run leaves: the batches
      # before the part that did not fit are applied, held to the gate and seen; that part and
      # every later batch are not marked seen, so a later run extracts them. A gated run that
      # fails its gate ends `apply-refused` as any gated run does, its reason also naming the part
      # that did not fit. ESS declares no exit status and no effect on files outside the model's
      # records; tests/batch_fits_model_window.rs holds it.
      - name: batch-too-large
        external: >-
          `claude` answers that a part of several documents of an extraction batch is too long for
          the model's window, or that its answer was cut off at the output limit, after the batch
          was split 3 deep
        error: cortex.instance.BatchTooLarge
        compensates: true
        updates: cortex.instance.Source
        instance: source_id
        sets:
          last_outcome: batch-too-large
          last_run_at: {generated: true}
          last_reason: {generated: true}
        payload:
          cortex.instance.BatchTooLarge:
            reason: {generated: true}
        summary: >-
          The source's status records the outcome and its reason, which names the documents of the
          part that did not fit and the batch size used, and the scheduler sends no RecordFailure:
          the batch, not the source, failed, so the failure is not counted and never disables the
          source. The batches before it stay applied; the rest are extracted by a later run.
          A part of one document is not this outcome: the run leaves it out and goes on.

      # UNMAPPED: the signal and the safe point. `cortex run` (not `--fetch-only`) handles SIGTERM:
      # the run stops at its next safe point, before a fetch result is used, before each batch, or
      # by ending the model call in flight (its process group is sent SIGTERM, then SIGKILL after
      # 5 s); a structured source stops before each record batch. A gated run is undone as a run
      # its gate refuses is: its stage abandoned and `state/` put back, or its kept snapshot
      # restored; an ungated run keeps the batches it applied, each marked seen, and its window
      # is kept pending, as a failed run's is. A second SIGTERM ends the process at once, exit
      # 143, recording nothing. `terminated` exits 8; its status, metric and hook report it while
      # the scheduler counts nothing. ESS has no signal construct and declares no exit status;
      # tests/run_metrics.rs holds it.
      - name: terminated
        external: The run is sent SIGTERM before it ends
        error: cortex.instance.RunTerminated
        compensates: true
        updates: cortex.instance.Source
        instance: source_id
        sets:
          last_outcome: terminated
          last_run_at: {generated: true}
          last_reason: {generated: true}
        payload:
          cortex.instance.RunTerminated:
            reason: {generated: true}
        summary: >-
          The run stopped at its next safe point; the source's status records the outcome and its
          reason, which says what was undone, and the scheduler sends no RecordFailure: the run
          was stopped, the source did not fail, so the failure is not counted and never disables
          the source. The next scheduled run starts as usual.

      # UNMAPPED: how a model call's failure is told to be `model-unavailable`: by its error text,
      # in any case. `refused`: `claude` (through `timeout`) could not be started (exit 126 or
      # 127), or its error says `connection refused`, `ECONNREFUSED`, `Connection error` or
      # `Unable to connect`; `not-loaded`: `model not loaded`, `no models loaded`, `model is
      # loading` or `currently loading`; `gateway-down`: an `API Error` with status 502, 503 or
      # 504, `Bad Gateway`, `Service Unavailable` or `Gateway Timeout`. A call that timed out, an
      # answer that is not valid, and every other error stay `extraction-failed`. An error answer
      # that cost zero is asked once more first, as any is. What the run leaves: the batches before
      # it are applied, held to the gate and seen, as for `batch-too-large`; that batch and every
      # later one are not marked seen. `model-unavailable` exits 7; its status, metric and hook
      # report it while the scheduler counts nothing. ESS states neither a classification of
      # text nor an exit status; tests/model_unavailable.rs holds it.
      - name: model-unavailable
        external: >-
          The run's model cannot be reached: its process cannot be started, its connection is
          refused, the server behind the gateway has not loaded the model, or the gateway answers
          HTTP 502, 503 or 504
        error: cortex.instance.ModelUnavailable
        compensates: true
        updates: cortex.instance.Source
        instance: source_id
        sets:
          last_outcome: model-unavailable
          last_run_at: {generated: true}
          last_reason: {generated: true}
        payload:
          cortex.instance.ModelUnavailable:
            cause: {generated: true}
            reason: {generated: true}
        summary: >-
          The source's status records the outcome and its reason, and the scheduler sends no
          RecordFailure: the model, not the source, failed, so the failure is not counted and
          never disables the source, however often the model is down. The batches before it stay
          applied; the rest are extracted by a later run.

      # UNMAPPED: a part of one document that still does not fit the model's window is left out
      # alone, as a record whose value does not convert is: it is named, by its key, in the run's
      # report (`too_large`) and its `cortex.log` line, and marked seen with its content hash, so it
      # is not asked again until its text changes; the run goes on with the following batches and
      # ends `ran`. The specification has no construct for the report's list of documents left
      # out; tests/batch_fits_model_window.rs and tests/batch_fits_model_window_adv.rs hold it.
      - name: ran
        updates: cortex.instance.Source
        instance: source_id
        sets:
          runs: {increment: 1}
          consecutive_failures: 0
          last_outcome: ran
          last_run_at: {generated: true}
          last_reason: {cleared: true}
        emits:
          - cortex.instance.SourceRan
        payload:
          cortex.instance.SourceRan:
            source_id: input.source_id
            documents_new: {generated: true}
            documents_applied: {generated: true}
            cost_usd: {generated: true}
            cost_counted: {generated: true}
            daily_ceiling_reached: {generated: true}
            model_calls: {generated: true}
            input_tokens: {generated: true}
            cache_read_input_tokens: {generated: true}
            cache_creation_input_tokens: {generated: true}
            output_tokens: {generated: true}
            fixed_input_tokens: {generated: true}
            documents_input_tokens: {generated: true}
            batch_chars: {generated: true}
            splits: {generated: true}
        summary: >-
          Every new or changed document within the policy's limits was extracted and applied, in
          batches, until the run's budget was spent. `documents_new` 0 means nothing changed and no
          model was called. `daily_ceiling_reached` is true when the run stopped before a batch
          because the instance's spend of the UTC day reached `model.daily_ceiling_usd` or its
          tokens reached `model.daily_ceiling_tokens`: the
          batches before it are applied, the rest are extracted by a run on a later day. A run
          stopped because an answer's tokens could not be counted does not set it. `cost_counted`
          is false behind a model gateway, where `cost_usd` is as reported and bounded nothing.

      - name: no-such-source
        unknown_instance: true
        error: cortex.instance.SourceNotFound
        payload:
          cortex.instance.SourceNotFound:
            source_id: input.source_id
        summary: Nothing ran.

  - name: cortex.instance.RecordFailure
    naming:
      wire: record-failure
      display: Record a failed run
    input:
      - {name: source_id, type: cortex.instance.SourceId}
      - {name: reason, type: String}
    outcomes:
      - name: disabled
        when_subject:
          predicate: consecutive_failures >= 1
        moves: cortex.instance.Source.disable
        instance: source_id
        sets:
          consecutive_failures: {increment: 1}
        emits:
          - cortex.instance.SourceDisabled
        payload:
          cortex.instance.SourceDisabled:
            source_id: input.source_id
            reason: input.reason
        summary: The second failure in a row disables the source's timer.

      - name: counted
        updates: cortex.instance.Source
        instance: source_id
        sets:
          consecutive_failures: {increment: 1}
        emits:
          - cortex.instance.RunFailed
        payload:
          cortex.instance.RunFailed:
            source_id: input.source_id
            reason: input.reason
        summary: The failure is counted; the timer stays enabled.

      - name: already-disabled
        wrong_state: true
        error: cortex.instance.SourceDisabledError
        payload:
          cortex.instance.SourceDisabledError:
            source_id: input.source_id
        summary: The source was already disabled; nothing was counted.

      - name: no-such-source
        unknown_instance: true
        error: cortex.instance.SourceNotFound
        payload:
          cortex.instance.SourceNotFound:
            source_id: input.source_id
        summary: Nothing was counted.

  - name: cortex.instance.EnableSource
    naming:
      wire: enable
      display: Enable a source
    input:
      - {name: source_id, type: cortex.instance.SourceId}
    outcomes:
      - name: enabled
        moves: cortex.instance.Source.enable
        instance: source_id
        sets:
          consecutive_failures: 0
        emits:
          - cortex.instance.SourceEnabled
        payload:
          cortex.instance.SourceEnabled:
            source_id: input.source_id
        summary: The failure count is reset and the timer is enabled again.

      - name: wrong-state
        wrong_state: true
        error: cortex.instance.SourceNotDisabled
        payload:
          cortex.instance.SourceNotDisabled:
            state: {generated: true}
        summary: The source was not disabled.

      - name: no-such-source
        unknown_instance: true
        error: cortex.instance.SourceNotFound
        payload:
          cortex.instance.SourceNotFound:
            source_id: input.source_id
        summary: Nothing changed.

  - name: cortex.instance.RestoreSnapshot
    naming:
      wire: restore
      display: Restore a snapshot
    # A run of a `sqlite` instance copies the store and its state before its first apply and keeps
    # the copy, `<run start ms>-<source>`, once that apply commits; the newest `snapshots.keep`
    # (default 3) of the snapshots cortex named are kept. `snapshot` names any `.sqlite` file in the
    # instance's `snapshots/` directory, without the extension.
    input:
      - {name: name, type: cortex.instance.InstanceName}
      - {name: snapshot, type: String}
    outcomes:
      - name: backend-unsupported
        external: The instance's store is on the postgres backend, whose snapshot is the operator's database backup
        error: cortex.instance.RestoreUnsupported
        payload:
          cortex.instance.RestoreUnsupported:
            name: input.name
        summary: Nothing was restored.

      - name: busy
        external: Another cortex command holds the home's lock, or another connection holds the store's write lock for 5 seconds
        error: cortex.instance.InstanceBusy
        payload:
          cortex.instance.InstanceBusy:
            reason: {generated: true}
        summary: Nothing was restored.

      - name: no-such-snapshot
        external: The instance directory holds no snapshot by this name
        error: cortex.instance.SnapshotNotFound
        payload:
          cortex.instance.SnapshotNotFound:
            snapshot: input.snapshot
        summary: Nothing was restored.

      - name: restored
        updates: cortex.instance.Instance
        instance: name
        emits:
          - cortex.instance.SnapshotRestored
        payload:
          cortex.instance.SnapshotRestored:
            name: input.name
            snapshot: input.snapshot
        summary: >-
          The store and the instance state were snapshotted as `<ms>-before-restore`, then put
          back to the snapshot's copies: every source's seen state and the known entity names
          included, so the next runs apply again what the undone runs applied. A viewer that was
          running was stopped first and started again after.

      - name: no-such-instance
        unknown_instance: true
        error: cortex.instance.InstanceNotFound
        payload:
          cortex.instance.InstanceNotFound:
            name: input.name
        summary: Nothing was restored.

  - name: cortex.instance.MeasureQuality
    naming:
      wire: quality
      display: Measure fact quality
    # `ekr sample` draws `sample` of the store's active facts at its head, each with the evidence it
    # cites, seeded with the measurement's start in Unix milliseconds. Each batch of 20 goes to the
    # instance's model with no tools and the judge's own system prompt, shown as the redaction
    # policy shows a run's documents; the model answers a `cortex.instance.QualityVerdict` per fact.
    # `ekr fact-quality` turns the verdicts into a pass rate with its Wilson interval at 95 %. The
    # measurement writes `quality/<UTC stamp>/verdicts.jsonl` and `quality/<UTC stamp>/
    # fact-quality.json` (the `ekr.fact-quality/1` document, as EKR printed it) under the instance
    # directory, and spends at most the spec's `model.budget_usd` and what is left of its
    # `model.daily_ceiling_usd` for the UTC day; in tokens, it stops before a further call once
    # its answers' tokens reach `model.budget_tokens` or the day's reach
    # `model.daily_ceiling_tokens`; behind a model gateway, in tokens only. It reads the store and
    # writes nothing to it, so a removed instance's store, which stays, is measured too.
    input:
      - {name: name, type: cortex.instance.InstanceName}
      - {name: sample, type: Integer}
    outcomes:
      - name: sample-failed
        external: EKR cannot draw the sample, its size is outside 1 to 1000 or the store cannot be read
        error: cortex.instance.SampleFailed
        payload:
          cortex.instance.SampleFailed:
            reason: {generated: true}
        summary: No model was asked and nothing was written.

      - name: judge-failed
        external: A judge's model call fails, times out, answers no valid verdicts or finds the budget or the daily ceiling spent, or the redaction policy refuses what the judge would be shown
        error: cortex.instance.JudgeFailed
        payload:
          cortex.instance.JudgeFailed:
            reason: {generated: true}
        summary: No pass rate was written; the verdicts of the batches judged before stay.

      - name: measured
        updates: cortex.instance.Instance
        instance: name
        emits:
          - cortex.instance.QualityMeasured
        payload:
          cortex.instance.QualityMeasured:
            name: input.name
            stamp: {generated: true}
            revision: {generated: true}
            seed: {generated: true}
            judged: {generated: true}
            passed: {generated: true}
            unclear: {generated: true}
            rate: {generated: true}
            lower: {generated: true}
            upper: {generated: true}
            cost_usd: {generated: true}
        summary: >-
          Every sampled fact was judged. `judged` counts them, `passed` those judged `yes` and
          `unclear` those the judge could not tell, which count as failed. `rate` is the pass rate,
          absent when the store holds no fact to draw; `lower` and `upper` are its Wilson interval
          at 95 %, 0 and 1 then. `cost_usd` is what the judge's model calls cost in USD, absent as
          soon as one answer carried no cost and never 0 for it. `revision` and `seed` draw the
          same sample again.

      - name: no-such-instance
        unknown_instance: true
        error: cortex.instance.InstanceNotFound
        payload:
          cortex.instance.InstanceNotFound:
            name: input.name
        summary: Nothing was measured.

  - name: cortex.instance.RunEval
    naming:
      wire: run
      display: Run an eval set
    # `set` is the path of a `cortex.instance.EvalSet` file. Each case's question is answered in
    # the set's order by `runner`, and scored with no model: the answer passes when it contains
    # every `expect_facts` string and cites every `expect_nodes` id. `mcp` asks the instance's
    # model, through the `claude` backend, with the store's MCP reader (`ekr mcp`, as `mcp-line`
    # prints it) as its only tools, and spends at most the spec's `model.budget_usd` and what is
    # left of its `model.daily_ceiling_usd` for the UTC day, held to `model.budget_tokens` and
    # `model.daily_ceiling_tokens` as MeasureQuality is; it answers a JSON object with `answer`
    # and `cited_nodes`. `ask` asks a running `cortex ask serve`. `replay` reads the answers of
    # the earlier eval run `from` names (its stamp under `eval/`) by case id, and asks no model.
    # The run writes `eval/<UTC stamp>/results.jsonl` (a `cortex.instance.EvalResult` per case)
    # and `eval/<UTC stamp>/summary.json` (the `cortex.instance.EvalRun`, with the per-check
    # counts and tokens of the event) under the instance directory. It reads the store and
    # writes nothing to it.
    input:
      - {name: name, type: cortex.instance.InstanceName}
      - {name: set, type: String}
      - {name: runner, type: cortex.instance.EvalRunner}
      - {name: from, type: Optional<String>}
    outcomes:
      - name: set-invalid
        external: The set cannot be read or is not a cortex.eval-case/1 set, or from is missing for replay or given for another runner
        error: cortex.instance.EvalSetInvalid
        payload:
          cortex.instance.EvalSetInvalid:
            reason: {generated: true}
        summary: No model was asked and nothing was written.

      - name: runner-failed
        external: The runner cannot answer a case, its model call fails or finds the budget or the daily ceiling spent, no ask service answers, or the replayed run recorded no answer for a case
        error: cortex.instance.EvalRunnerFailed
        payload:
          cortex.instance.EvalRunnerFailed:
            reason: {generated: true}
        summary: No summary was written; the results of the cases answered before stay.

      - name: evaluated
        updates: cortex.instance.Instance
        instance: name
        emits:
          - cortex.instance.EvalRan
        payload:
          cortex.instance.EvalRan:
            name: input.name
            stamp: {generated: true}
            runner: input.runner
            cases: {generated: true}
            passed: {generated: true}
            facts_expected: {generated: true}
            facts_found: {generated: true}
            nodes_expected: {generated: true}
            nodes_found: {generated: true}
            model_calls: {generated: true}
            input_tokens: {generated: true}
            output_tokens: {generated: true}
            cost_usd: {generated: true}
        summary: >-
          Every case was answered and scored. `cases` counts them and `passed` those that passed;
          `facts_expected` and `facts_found` count the expected fact strings and those the answers
          contain, `nodes_expected` and `nodes_found` the expected node ids and those the answers
          cite. `model_calls` counts the model calls, 0 for `replay`; `input_tokens` and
          `output_tokens` are their tokens, absent as soon as one answer carried no count;
          `cost_usd` is what they cost in USD, absent as soon as one answer carried no cost.

      - name: no-such-instance
        unknown_instance: true
        error: cortex.instance.InstanceNotFound
        payload:
          cortex.instance.InstanceNotFound:
            name: input.name
        summary: Nothing was asked or written.

  - name: cortex.instance.AddEvalCase
    naming:
      wire: case
      display: Add an eval case from a review
    # `cortex eval case add <name> --set <set> --from-review <review id>`: the closed review item
    # `from_review` (`cortex.ask.ReviewItem`) of the instance's answer records becomes one case
    # appended to the `cortex.instance.EvalSet` file `set`: its `id` and `review_id` are the
    # review id, its `question` that of the item's answer record (`cortex.ask.AnswerRecord`), and
    # its `expect_facts` and `expect_nodes` those the reviewer wrote when closing the item
    # (`cortex.ask.CloseReview`). A set file that does not exist yet is created holding the one
    # case. The records are read, never written: the file `ask.sqlite` is opened read-only, never
    # created (an instance that served no question has none: `no-such-review`) and never migrated
    # (a file of schema version 1 reads with no expectations). An item with no expected fact and
    # no expected node is refused (`no-expectations`). A set path that is a symbolic link is
    # written through to its target. Nothing but the set file changes, and a refusal leaves it as
    # it was, a missing file not created. One review item yields at most one case in a set.
    # UNMAPPED: the command line is `eval case add`, a word below the group the specification's
    # one level of command groups cannot name; the wire `case` is that word, `add` is clap's, and
    # the clap ⇔ spec test in `src/main.rs` walks it.
    # UNMAPPED: `added` writes the set file, a file the operator names outside the instance; one
    # outcome does one thing to one entity, and `no-such-instance` needs the outcome to name the
    # Instance, so `added` updates the Instance as RunEval's `evaluated` does, and `src/eval.rs`
    # writes the file; `tests/eval_run.rs` tests it.
    input:
      - {name: name, type: cortex.instance.InstanceName}
      - {name: set, type: String}
      - {name: from_review, type: cortex.ask.ReviewId}
    outcomes:
      - name: set-invalid
        external: The set file exists and cannot be read or is not a cortex.eval-case/1 set
        error: cortex.instance.EvalSetInvalid
        payload:
          cortex.instance.EvalSetInvalid:
            reason: {generated: true}
        summary: The set file is unchanged.

      - name: no-such-review
        external: The instance's answer records hold no review item from_review names, or not its answer
        error: cortex.instance.EvalReviewNotFound
        payload:
          cortex.instance.EvalReviewNotFound:
            review_id: input.from_review
        summary: The set file is unchanged.

      - name: review-open
        external: The review item from_review names is still open
        error: cortex.instance.EvalReviewOpen
        payload:
          cortex.instance.EvalReviewOpen:
            review_id: input.from_review
        summary: >-
          The item has no expectations until a reviewer closes it; the set file is unchanged.

      - name: no-expectations
        external: The review item from_review names is closed with no expected fact and no expected node
        error: cortex.instance.EvalNoExpectations
        payload:
          cortex.instance.EvalNoExpectations:
            review_id: input.from_review
        summary: >-
          A case with nothing expected passes every answer; the set file is unchanged and not
          created.

      - name: case-exists
        external: The set already holds a case with the review id as its id or its review_id
        error: cortex.instance.EvalCaseExists
        payload:
          cortex.instance.EvalCaseExists:
            review_id: input.from_review
        summary: The set file is unchanged.

      - name: added
        updates: cortex.instance.Instance
        instance: name
        emits:
          - cortex.instance.EvalCaseAdded
        payload:
          cortex.instance.EvalCaseAdded:
            name: input.name
            set: input.set
            review_id: input.from_review
            id: {generated: true}
            cases: {generated: true}
        summary: >-
          The set file ends with the new case; `id` is the case's id and `cases` counts the
          set's cases with it.

      - name: no-such-instance
        unknown_instance: true
        error: cortex.instance.InstanceNotFound
        payload:
          cortex.instance.InstanceNotFound:
            name: input.name
        summary: Nothing was read or written.

  - name: cortex.instance.ProposeSchemaChanges
    naming:
      wire: schema
      display: Propose schema changes
    # Under the home's lock, `ekr sample` draws `sample` of the store's active facts at its head,
    # each with the evidence it cites, and `ekr ontology` reads the schema in force; then, without
    # the lock, each batch of 20 goes to the instance's model with no tools and its own system
    # prompt, shown as the redaction policy shows a run's documents, beside the ontology's type and
    # property names. The model answers `cortex.instance.SchemaProposals`. A proposal citing a fact
    # or an evidence label its batch does not hold, or citing no fact, is dropped. Of the answer,
    # only each proposal's `reason` has the batch's placeholders restored. A redeclaration changes
    # the value kind and the cardinality it names; whether the property is required and its
    # constraints stay as the store declares them. Without
    # `dry_run`, cortex takes the lock again and asks EKR to apply each proposal it can write as
    # one schema transaction of its own, in order, against the ontology at the head. Every proposal
    # not dropped is a `cortex.instance.SchemaProposal` line of `schema/<UTC stamp>/proposals.jsonl`
    # under the instance directory. Spends at most the spec's `model.budget_usd` and what is left
    # of its `model.daily_ceiling_usd` for the UTC day; in tokens, it stops before a further call
    # once its answers' tokens reach `model.budget_tokens` or the day's reach
    # `model.daily_ceiling_tokens`; behind a model gateway, in tokens only. With `review`, nothing
    # is applied and the lock is not taken again: every proposal not dropped is recorded `pending`
    # (one whose name holds a placeholder of the redaction policy `invalid`, as in any run) for
    # `cortex.instance.ApproveSchemaProposals` and `cortex.instance.RejectSchemaProposals`, and
    # `cortex.instance.ApplySchemaProposals` applies the approved ones. `dry_run` and `review`
    # exclude each other.
    input:
      - {name: name, type: cortex.instance.InstanceName}
      - {name: sample, type: Integer}
      - {name: dry_run, type: Boolean}
      - {name: review, type: Boolean}
    outcomes:
      - name: sample-failed
        external: EKR cannot draw the sample, its size is outside 1 to 1000 or the store cannot be read
        error: cortex.instance.SampleFailed
        payload:
          cortex.instance.SampleFailed:
            reason: {generated: true}
        summary: No model was asked and nothing was written.

      - name: propose-failed
        external: A model call fails, times out, answers no valid proposals or finds the budget or the daily ceiling spent, the redaction policy refuses what the model would be shown, or EKR cannot read the ontology
        error: cortex.instance.ProposeFailed
        payload:
          cortex.instance.ProposeFailed:
            reason: {generated: true}
        summary: Nothing was applied and no `proposals.jsonl` was written.

      - name: proposed
        when: dry_run
        updates: cortex.instance.Instance
        instance: name
        emits:
          - cortex.instance.SchemaChangesProposed
        payload:
          cortex.instance.SchemaChangesProposed:
            name: input.name
            stamp: {generated: true}
            revision: {generated: true}
            proposed: {generated: true}
            applied: {generated: true}
            refused: {generated: true}
            recorded_only: {generated: true}
            invalid: {generated: true}
            pending: {generated: true}
            dropped: {generated: true}
            cost_usd: {generated: true}
        summary: >-
          A dry run: every proposal not dropped is recorded and none is applied; `applied` and
          `refused` are 0, and a change EKR would be asked to apply is `dry-run`. `cost_usd` is
          what the model calls cost in USD, absent as soon as one answer carried no cost and never
          0 for it.

      - name: reviewed
        when: review
        updates: cortex.instance.Instance
        instance: name
        emits:
          - cortex.instance.SchemaChangesProposed
        payload:
          cortex.instance.SchemaChangesProposed:
            name: input.name
            stamp: {generated: true}
            revision: {generated: true}
            proposed: {generated: true}
            applied: {generated: true}
            refused: {generated: true}
            recorded_only: {generated: true}
            invalid: {generated: true}
            pending: {generated: true}
            dropped: {generated: true}
            cost_usd: {generated: true}
        summary: >-
          A review run: every proposal not dropped is recorded `pending` and none is applied,
          except one whose name holds a placeholder of the redaction policy, `invalid`; `pending`
          counts them and `applied`, `refused` and `recorded_only` are 0.
          `stamp` names the run for `approve`, `reject` and `apply`. `cost_usd` is what the model
          calls cost in USD, absent as soon as one answer carried no cost and never 0 for it.

      - name: applied
        updates: cortex.instance.Instance
        instance: name
        emits:
          - cortex.instance.SchemaChangesProposed
        payload:
          cortex.instance.SchemaChangesProposed:
            name: input.name
            stamp: {generated: true}
            revision: {generated: true}
            proposed: {generated: true}
            applied: {generated: true}
            refused: {generated: true}
            recorded_only: {generated: true}
            invalid: {generated: true}
            pending: {generated: true}
            dropped: {generated: true}
            cost_usd: {generated: true}
        summary: >-
          Every proposal EKR accepted is committed, each as its own schema transaction and schema
          version; `applied` counts them, 0 when it accepted none. `revision` is the head the
          sample was drawn at, so `ekr ontology --at <revision>` still answers the schema before.
          `cost_usd` is what the model calls cost in USD, absent as soon as one answer carried no
          cost and never 0 for it.

      - name: no-such-instance
        unknown_instance: true
        error: cortex.instance.InstanceNotFound
        payload:
          cortex.instance.InstanceNotFound:
            name: input.name
        summary: Nothing was proposed.

  - name: cortex.instance.ApproveSchemaProposals
    naming:
      wire: approve
      display: Approve schema proposals
    # Under the home's lock, rewrites the decision of each named proposal of the review run
    # `stamp` (`only`, 1-based lines of its `proposals.jsonl`; every pending one when empty) from
    # `pending` to `approved`, with `by` as `decided_by`. Asks no model and touches no store.
    input:
      - {name: name, type: cortex.instance.InstanceName}
      - {name: stamp, type: String}
      - {name: only, type: List<Integer>}
      - {name: by, type: Optional<String>}
    outcomes:
      - name: no-such-run
        external: The instance has no readable `schema/<stamp>/proposals.jsonl`
        error: cortex.instance.SchemaRunNotFound
        payload:
          cortex.instance.SchemaRunNotFound:
            stamp: input.stamp
            reason: {generated: true}
        summary: Nothing was decided.

      - name: not-pending
        external: A proposal `only` names is not in the run or is not `pending`, or the run has no pending proposal
        error: cortex.instance.SchemaProposalsNotPending
        payload:
          cortex.instance.SchemaProposalsNotPending:
            reason: {generated: true}
        summary: Nothing was decided.

      - name: approved
        updates: cortex.instance.Instance
        instance: name
        emits:
          - cortex.instance.SchemaProposalsDecided
        payload:
          cortex.instance.SchemaProposalsDecided:
            name: input.name
            stamp: input.stamp
            decision: {generated: true}
            decided: {generated: true}
            pending: {generated: true}
        summary: >-
          Each named proposal is `approved`; `decided` counts them, `pending` what the run still
          holds undecided. `decision` is `approved`.

      - name: no-such-instance
        unknown_instance: true
        error: cortex.instance.InstanceNotFound
        payload:
          cortex.instance.InstanceNotFound:
            name: input.name
        summary: Nothing was decided.

  - name: cortex.instance.RejectSchemaProposals
    naming:
      wire: reject
      display: Reject schema proposals
    # As `cortex.instance.ApproveSchemaProposals`, to `rejected`, with `reason` as each line's
    # `decision_reason`. A rejected proposal is never applied.
    input:
      - {name: name, type: cortex.instance.InstanceName}
      - {name: stamp, type: String}
      - {name: only, type: List<Integer>}
      - {name: reason, type: String}
      - {name: by, type: Optional<String>}
    outcomes:
      - name: no-such-run
        external: The instance has no readable `schema/<stamp>/proposals.jsonl`
        error: cortex.instance.SchemaRunNotFound
        payload:
          cortex.instance.SchemaRunNotFound:
            stamp: input.stamp
            reason: {generated: true}
        summary: Nothing was decided.

      - name: not-pending
        external: A proposal `only` names is not in the run or is not `pending`, the run has no pending proposal, or the reason is blank
        error: cortex.instance.SchemaProposalsNotPending
        payload:
          cortex.instance.SchemaProposalsNotPending:
            reason: {generated: true}
        summary: Nothing was decided.

      - name: rejected
        updates: cortex.instance.Instance
        instance: name
        emits:
          - cortex.instance.SchemaProposalsDecided
        payload:
          cortex.instance.SchemaProposalsDecided:
            name: input.name
            stamp: input.stamp
            decision: {generated: true}
            decided: {generated: true}
            pending: {generated: true}
        summary: >-
          Each named proposal is `rejected` with the reason; `decided` counts them, `pending` what
          the run still holds undecided. `decision` is `rejected`.

      - name: no-such-instance
        unknown_instance: true
        error: cortex.instance.InstanceNotFound
        payload:
          cortex.instance.InstanceNotFound:
            name: input.name
        summary: Nothing was decided.

  - name: cortex.instance.ApplySchemaProposals
    naming:
      wire: apply
      display: Apply approved schema proposals
    # Under the home's lock, reads the review run's `proposals.jsonl` and plans each `approved`
    # proposal against the ontology at the head, as a run without `--review` does: one whose type
    # or property is there already, or that names one that is not, is `invalid`; a remove, merge or
    # split is `recorded-only`. Each other one is asked of EKR as one schema transaction of its own,
    # the change as recorded, and is `applied` or `refused`. No model is asked. On a `postgres`
    # store the transactions run in an EKR stage (`ekr stage begin`), published at the head it
    # began from only when every transaction was answered and the spec's `gate` passed, and
    # abandoned otherwise. On a `sqlite` store a snapshot `<ms>-schema-<stamp>` is taken first and
    # kept once a transaction commits, for `cortex restore`; a gate that fails restores it. A
    # gate's checks on the run report's measures (`documents_new`, `cost_usd`, …) are a source
    # run's and are not read; checks on `ekr quality`'s numbers are.
    # UNMAPPED: whether a schema apply needs gate measures of its own is open.
    input:
      - {name: name, type: cortex.instance.InstanceName}
      - {name: stamp, type: String}
    outcomes:
      - name: no-such-run
        external: The instance has no readable `schema/<stamp>/proposals.jsonl`
        error: cortex.instance.SchemaRunNotFound
        payload:
          cortex.instance.SchemaRunNotFound:
            stamp: input.stamp
            reason: {generated: true}
        summary: Nothing was applied.

      - name: not-approved
        external: The run holds no `approved` proposal
        error: cortex.instance.SchemaProposalsNotApproved
        payload:
          cortex.instance.SchemaProposalsNotApproved:
            reason: {generated: true}
        summary: Nothing was applied.

      - name: gate-failed
        external: The store after the changes fails a check of the spec's gate
        error: cortex.instance.SchemaGateFailed
        payload:
          cortex.instance.SchemaGateFailed:
            reason: {generated: true}
        summary: >-
          Nothing was published; every approved proposal is still `approved`, and the store's
          head is where it was (`postgres`) or back at the snapshot (`sqlite`).

      - name: apply-failed
        external: EKR cannot read the ontology, begin the stage, take the snapshot, mint an id or answer a transaction
        error: cortex.instance.SchemaApplyFailed
        payload:
          cortex.instance.SchemaApplyFailed:
            reason: {generated: true}
        summary: Nothing was published; every approved proposal is still `approved`.

      - name: store-outcome-unknown
        external: EKR cannot say whether the stage's begin or publish took effect
        error: cortex.instance.StoreOutcomeUnknown
        payload:
          cortex.instance.StoreOutcomeUnknown:
            reason: {generated: true}
        summary: >-
          Every approved proposal is still `approved`. The stage is kept in `stage.json`, and the
          next run of a source settles it.

      - name: applied
        updates: cortex.instance.Instance
        instance: name
        emits:
          - cortex.instance.SchemaProposalsApplied
        payload:
          cortex.instance.SchemaProposalsApplied:
            name: input.name
            stamp: input.stamp
            applied: {generated: true}
            refused: {generated: true}
            recorded_only: {generated: true}
            invalid: {generated: true}
            revision: {generated: true}
        summary: >-
          Every approved proposal is decided: `applied` with the revision and schema version it
          committed, or `refused`, `recorded-only` or `invalid` with why. `revision` is the store's
          head after the apply. Proposals still `pending` stay so.

      - name: no-such-instance
        unknown_instance: true
        error: cortex.instance.InstanceNotFound
        payload:
          cortex.instance.InstanceNotFound:
            name: input.name
        summary: Nothing was applied.

events:
  - name: cortex.instance.InstanceCreated
    fields:
      - {name: name, type: cortex.instance.InstanceName}
      - {name: view_port, type: Integer}

  - name: cortex.instance.InstanceAdopted
    fields:
      - {name: name, type: cortex.instance.InstanceName}
      - {name: revision, type: Integer}
      - {name: view_port, type: Integer}

  - name: cortex.instance.InstanceUpdated
    fields:
      - {name: name, type: cortex.instance.InstanceName}

  - name: cortex.instance.InstanceRemoved
    fields:
      - {name: name, type: cortex.instance.InstanceName}

  - name: cortex.instance.SourceAdded
    fields:
      - {name: source_id, type: cortex.instance.SourceId}
      - {name: instance_name, type: cortex.instance.InstanceName}

  # `daily_ceiling_reached` says the run stopped before a batch at one of the instance's daily
  # ceilings, `model.daily_ceiling_usd` or `model.daily_ceiling_tokens`, because the day's spend
  # or tokens reached it. A run stopped under a daily ceiling for another reason (an answer whose
  # tokens could not be counted, a spend of the day that could not be read or recorded) does not
  # set it; its `stopped` reason says why.
  # `model_calls` counts every model call the run made: a call asked again after an error answer
  # that cost zero counts twice, and a call that failed counts too. The token fields add up, over
  # those calls, what the model reported in its answer's `usage`: `input_tokens`,
  # `cache_read_input_tokens`, `cache_creation_input_tokens` and `output_tokens`. Each is `0` for
  # a run with no model call, the sum while every answer reported it, and absent as soon as one
  # answer did not; a missing count is never `0`. The model reports input per call only, so
  # `fixed_input_tokens` and `documents_input_tokens` are an estimate: each call's input, cache
  # reads and cache writes together, apportioned by bytes between the fixed part of the request
  # (the system prompt, the answer's schema, and the prompt up to the documents: the instance's
  # description and instructions, the ontology and the known entity names) and the documents.
  # The two add up to `input_tokens` + `cache_read_input_tokens` + `cache_creation_input_tokens`.
  # `cost_counted` is false when the instance's model is behind a gateway: `cost_usd` is then what
  # `claude` reported, counted against no dollar limit (`cortex.instance.ModelSpec`).
  # `batch_chars` is the most characters of document text, counted as UTF-8 bytes, the run put in
  # one extraction request (`cortex.instance.ModelSpec.batch_chars`, given or derived); `splits`
  # counts the batches it split in two because a request was too long for the model's window or
  # its answer was cut off.
  - name: cortex.instance.SourceRan
    fields:
      - {name: source_id, type: cortex.instance.SourceId}
      - {name: documents_new, type: Integer}
      - {name: documents_applied, type: Integer}
      - {name: cost_usd, type: Optional<Decimal>}
      - {name: cost_counted, type: Boolean}
      - {name: daily_ceiling_reached, type: Boolean}
      - {name: model_calls, type: Integer}
      - {name: input_tokens, type: Optional<Integer>}
      - {name: cache_read_input_tokens, type: Optional<Integer>}
      - {name: cache_creation_input_tokens, type: Optional<Integer>}
      - {name: output_tokens, type: Optional<Integer>}
      - {name: fixed_input_tokens, type: Optional<Integer>}
      - {name: documents_input_tokens, type: Optional<Integer>}
      - {name: batch_chars, type: Integer}
      - {name: splits, type: Integer}

  # A run of a disabled source, which ran nothing.
  - name: cortex.instance.RunSkipped
    fields:
      - {name: source_id, type: cortex.instance.SourceId}

  # A fetch-only run of a source: the window it asked about, as RFC 3339, and its documents
  # counted against the source's seen documents. `fetched` is `new` + `changed` + `held` +
  # `unchanged`; `unread` says, one line each, why the fetch left records unread.
  - name: cortex.instance.SourceFetched
    fields:
      - {name: source_id, type: cortex.instance.SourceId}
      - {name: since, type: Timestamp}
      - {name: until, type: Timestamp}
      - {name: fetched, type: Integer}
      - {name: new, type: Integer}
      - {name: changed, type: Integer}
      - {name: held, type: Integer}
      - {name: unchanged, type: Integer}
      - {name: unread, type: List<String>}

  - name: cortex.instance.RunFailed
    fields:
      - {name: source_id, type: cortex.instance.SourceId}
      - {name: reason, type: String}

  - name: cortex.instance.SourceDisabled
    fields:
      - {name: source_id, type: cortex.instance.SourceId}
      - {name: reason, type: String}

  - name: cortex.instance.SourceEnabled
    fields:
      - {name: source_id, type: cortex.instance.SourceId}

  - name: cortex.instance.SnapshotRestored
    fields:
      - {name: name, type: cortex.instance.InstanceName}
      - {name: snapshot, type: String}

  - name: cortex.instance.QualityMeasured
    fields:
      - {name: name, type: cortex.instance.InstanceName}
      - {name: stamp, type: String}
      - {name: revision, type: Integer}
      - {name: seed, type: Integer}
      - {name: judged, type: Integer}
      - {name: passed, type: Integer}
      - {name: unclear, type: Integer}
      - {name: rate, type: Optional<Decimal>}
      - {name: lower, type: Decimal}
      - {name: upper, type: Decimal}
      - {name: cost_usd, type: Optional<Decimal>}

  - name: cortex.instance.EvalRan
    fields:
      - {name: name, type: cortex.instance.InstanceName}
      - {name: stamp, type: String}
      - {name: runner, type: cortex.instance.EvalRunner}
      - {name: cases, type: Integer}
      - {name: passed, type: Integer}
      - {name: facts_expected, type: Integer}
      - {name: facts_found, type: Integer}
      - {name: nodes_expected, type: Integer}
      - {name: nodes_found, type: Integer}
      - {name: model_calls, type: Integer}
      - {name: input_tokens, type: Optional<Integer>}
      - {name: output_tokens, type: Optional<Integer>}
      - {name: cost_usd, type: Optional<Decimal>}

  # `id` is the new case's id and `cases` counts the set's cases with it.
  - name: cortex.instance.EvalCaseAdded
    fields:
      - {name: name, type: cortex.instance.InstanceName}
      - {name: set, type: String}
      - {name: review_id, type: cortex.ask.ReviewId}
      - {name: id, type: String}
      - {name: cases, type: Integer}

  # `proposed` counts the lines of `proposals.jsonl`; `applied`, `refused`, `recorded_only`,
  # `invalid` and `pending` count them by status, and the rest are `dry-run`. `dropped` counts the
  # proposals dropped for their citations, which are not written.
  - name: cortex.instance.SchemaChangesProposed
    fields:
      - {name: name, type: cortex.instance.InstanceName}
      - {name: stamp, type: String}
      - {name: revision, type: Integer}
      - {name: proposed, type: Integer}
      - {name: applied, type: Integer}
      - {name: refused, type: Integer}
      - {name: recorded_only, type: Integer}
      - {name: invalid, type: Integer}
      - {name: pending, type: Integer}
      - {name: dropped, type: Integer}
      - {name: cost_usd, type: Optional<Decimal>}

  # `decision` is `approved` or `rejected`; `decided` counts the proposals decided, `pending` the
  # run's proposals still undecided after.
  - name: cortex.instance.SchemaProposalsDecided
    fields:
      - {name: name, type: cortex.instance.InstanceName}
      - {name: stamp, type: String}
      - {name: decision, type: String}
      - {name: decided, type: Integer}
      - {name: pending, type: Integer}

  # The approved proposals of the run, counted by what `apply` decided; `revision` is the store's
  # head after.
  - name: cortex.instance.SchemaProposalsApplied
    fields:
      - {name: name, type: cortex.instance.InstanceName}
      - {name: stamp, type: String}
      - {name: applied, type: Integer}
      - {name: refused, type: Integer}
      - {name: recorded_only, type: Integer}
      - {name: invalid, type: Integer}
      - {name: revision, type: Integer}

views:
  - name: cortex.instance.Instances
    source: cortex.instance.Instance
    consistency: read_your_writes
    fields:
      - {name: name, type: cortex.instance.InstanceName}
      - {name: description, type: String}
      - {name: model, type: String}
      - {name: ekr_version, type: String}
      - {name: seed_digest, type: String}
      - {name: state, type: cortex.instance.Instance.State}
    naming:
      wire: list
      display: Instances

  - name: cortex.instance.Sources
    source: cortex.instance.Source
    consistency: read_your_writes
    fields:
      - {name: source_id, type: cortex.instance.SourceId}
      - {name: instance_name, type: cortex.instance.InstanceName}
      - {name: name, type: String}
      - {name: kind, type: cortex.instance.SourceKind}
      - {name: schedule, type: String}
      - {name: runs, type: Integer}
      - {name: consecutive_failures, type: Integer}
      - {name: state, type: cortex.instance.Source.State}
      - {name: last_outcome, type: Optional<cortex.instance.RunOutcome>}
      - {name: last_run_at, type: Optional<Timestamp>}
      - {name: last_reason, type: Optional<String>}
    naming:
      wire: sources
      display: Sources
