[package]
name = "cortex-cli"
version = "0.7.2"
edition = "2021"
description = "Spin up EKR knowledge brains from a spec, fed on a schedule by Connectors data sources."
license = "Apache-2.0"
publish = false

[lib]
name = "cortex_cli"
path = "src/lib.rs"

[[bin]]
name = "cortex"
path = "src/main.rs"

[dependencies]
# Generated from spec/ by `task generate`; never edited by hand.
cortex-model = { package = "cortex", path = "generated/cortex-model" }
cortex-spec-types = { path = "generated/spec-types" }

clap = { version = "4.6", features = ["derive", "env"] }
globset = "0.4"
regex = "1"
rusqlite = { version = "0.40", features = ["bundled", "backup"] }
rustix = { version = "1.1", features = ["fs", "process"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["arbitrary_precision"] }
serde_yaml_ng = "0.10"
sha2 = "0.10"
# SIGTERM for `cortex run` (`src/terminate.rs`): a flag set from the handler, no unsafe code here.
signal-hook = "0.4"
unicode-normalization = "0.1"
uuid = { version = "1", features = ["v7"] }
walkdir = "2"

# The answer service (`cortex ask serve`, `src/ask/`) only: an async runtime, an HTTP server, its
# event stream, and an HTTP client for the model gateway. Nothing on the path of `cortex run` uses them.
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time"] }
tokio-stream = { version = "0.1", default-features = false }
# The answer records of an instance on a `postgres` store (`src/ask/records/postgres.rs`): a
# synchronous PostgreSQL client over TLS, in the records process `cortex ask records` alone.
postgres = "0.19"
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
tokio-postgres-rustls = "0.14"
webpki-roots = "1"

[dev-dependencies]
roxmltree = "0.21"
tempfile = "3"

[workspace]
members = ["crates/cortex-docs"]
exclude = ["generated/cortex-model", "generated/spec-types"]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
