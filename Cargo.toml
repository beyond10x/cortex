[package]
name = "cortex-cli"
version = "0.1.0"
edition = "2021"
description = "Spin up EKR knowledge brains from a spec, fed on a schedule by Connectors data sources."
license = "Apache-2.0"
publish = false

[lib]
name = "cortex_cli"
path = "src/lib.rs"

[[bin]]
name = "cortex"
path = "src/main.rs"

[dependencies]
# Generated from spec/ by `task generate`; never edited by hand.
cortex-model = { package = "cortex", path = "generated/cortex-model" }
cortex-spec-types = { path = "generated/spec-types" }

clap = { version = "4.6", features = ["derive", "env"] }
globset = "0.4"
regex = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["arbitrary_precision"] }
serde_yaml_ng = "0.10"
sha2 = "0.10"
uuid = { version = "1", features = ["v7"] }
walkdir = "2"

[dev-dependencies]
tempfile = "3"

[workspace]
exclude = ["generated/cortex-model", "generated/spec-types"]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
