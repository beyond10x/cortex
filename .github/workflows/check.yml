name: Check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: ${{ github.workspace }}/target
  EKR_VERSION: "0.0.43"

jobs:
  check:
    name: task check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Decide whether the change needs the build and the tests
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            git diff --name-only "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/changed"
            scope=$(sh .github/scripts/scope.sh < "$RUNNER_TEMP/changed")
          else
            scope=run
          fi
          echo "scope=$scope" >> "$GITHUB_OUTPUT"
          echo "scope: $scope"

      - name: Install the Rust toolchain rust-toolchain.toml pins
        id: toolchain
        if: steps.scope.outputs.scope == 'run'
        run: |
          rustup toolchain install
          rustc --version
          echo "channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - name: Install cargo-nextest
        if: steps.scope.outputs.scope == 'run'
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-nextest@0.9.143

      - name: Install task runner
        if: steps.scope.outputs.scope == 'run'
        env:
          TASK_VERSION: "3.54.0"
          TASK_SHA256: 680859dbb4d881a9c72d4d9a8f510825450849af8567deacd7302c01124416fb
        run: |
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/task.tar.gz" \
            "https://github.com/go-task/task/releases/download/v$TASK_VERSION/task_linux_amd64.tar.gz"
          echo "$TASK_SHA256  $RUNNER_TEMP/task.tar.gz" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/task-bin"
          tar -xzf "$RUNNER_TEMP/task.tar.gz" -C "$RUNNER_TEMP/task-bin" task
          echo "$RUNNER_TEMP/task-bin" >> "$GITHUB_PATH"

      - name: Install pinned specification and planning tools
        env:
          ESS_VERSION: "0.77.0"
          ESS_SHA256: dd31b828bf6c6d9976f339b0a25dabcf0fa7fbb33c2856c49a1e3b71a5c00089
          AEP_VERSION: "0.75.0"
          AEP_SHA256: 5e32c6e284d4ca2bb11cecd5dac470b841acb36635c76a7a54a5687a6c2f275f
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tools-bin"
          for pair in "ess:$ESS_VERSION:$ESS_SHA256" "aep:$AEP_VERSION:$AEP_SHA256"; do
            IFS=: read -r tool version digest <<< "$pair"
            archive="$tool-$version-x86_64-unknown-linux-gnu.tar.gz"
            dir="$RUNNER_TEMP/$tool-release"
            mkdir -p "$dir"
            curl --fail --silent --show-error --location --output "$dir/$archive" \
              "https://github.com/beyond10x/$tool/releases/download/$version/$archive"
            curl --fail --silent --show-error --location --output "$dir/SHA256SUMS" \
              "https://github.com/beyond10x/$tool/releases/download/$version/SHA256SUMS"
            grep -qxF "$digest  $archive" "$dir/SHA256SUMS"
            (cd "$dir" && echo "$digest  $archive" | sha256sum --check --strict)
            tar -xzf "$dir/$archive" -C "$dir"
            find "$dir" -type f -name "$tool" -exec install -m 755 {} "$RUNNER_TEMP/tools-bin/" \;
          done
          echo "$RUNNER_TEMP/tools-bin" >> "$GITHUB_PATH"

      - name: Restore the ekr binary
        id: ekr-cache
        if: steps.scope.outputs.scope == 'run'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.ekr/${{ env.EKR_VERSION }}
          key: ekr-${{ env.EKR_VERSION }}-rust-${{ steps.toolchain.outputs.channel }}

      - name: Build ekr from its release tag
        if: steps.scope.outputs.scope == 'run' && steps.ekr-cache.outputs.cache-hit != 'true'
        run: |
          cargo install --locked --git https://github.com/beyond10x/epistemic-knowledge-runtime \
            --tag "$EKR_VERSION" --bin ekr --root "$HOME/.ekr/$EKR_VERSION" ekr

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: steps.scope.outputs.scope == 'run'
        with:
          shared-key: check-rust-${{ steps.toolchain.outputs.channel }}

      - name: Validate the planning store
        run: aep plan artifact validate

      - name: task check
        if: steps.scope.outputs.scope == 'run'
        run: |
          export CORTEX_TEST_EKR="$HOME/.ekr/$EKR_VERSION/bin/ekr"
          "$CORTEX_TEST_EKR" --version
          task check

      - name: Keep the test report
        if: always() && steps.scope.outputs.scope == 'run'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nextest-junit
          path: target/nextest/*/junit.xml
          if-no-files-found: ignore
          retention-days: 14

      - name: Planning or prose only
        if: steps.scope.outputs.scope == 'skip'
        run: echo "every changed path is planning or prose (.github/scripts/scope.sh); build and tests skipped"
