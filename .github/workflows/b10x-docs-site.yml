name: Documentation site

on:
  workflow_run:
    workflows: [Documentation validation]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: b10x-docs-pages
  cancel-in-progress: false

jobs:
  wait:
    if: >-
      github.actor == 'b10x-bot[bot]'
      && github.triggering_actor == 'b10x-bot[bot]'
      && github.repository == 'beyond10x/cortex'
      && github.ref == 'refs/heads/main'
      && (github.event_name == 'workflow_dispatch'
        || (github.event.workflow_run.conclusion == 'success'
          && github.event.workflow_run.event == 'push'
          && github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Wait until the runs API lists the build run
        env:
          CONTROL_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 30); do
            count="$(curl --fail-with-body --silent --show-error --location --retry 3 \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer $GITHUB_TOKEN" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/pages.yml/runs?head_sha=$CONTROL_SHA&branch=main&event=push&status=success&per_page=100" \
              | jq '.total_count')"
            if [ "$count" -gt 0 ]; then echo "listed after $attempt attempt(s)"; exit 0; fi
            sleep 10
          done
          echo "no successful pages.yml push run listed for $CONTROL_SHA after 300 s" >&2
          exit 1

  publish:
    needs: wait
    if: >-
      github.actor == 'b10x-bot[bot]'
      && github.triggering_actor == 'b10x-bot[bot]'
      && github.repository == 'beyond10x/cortex'
      && github.ref == 'refs/heads/main'
      && (github.event_name == 'workflow_dispatch'
        || (github.event.workflow_run.conclusion == 'success'
          && github.event.workflow_run.event == 'push'
          && github.event.workflow_run.head_branch == 'main'))
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: read
    uses: beyond10x/website/.github/workflows/project-site.yml@fb4024ef7846729e5456591b9070db3d48c87e64
    with:
      repository: cortex
      control_sha: ${{ github.event.workflow_run.head_sha || github.sha }}
      route_base: /cortex/
      build_workflow: pages.yml
      artifact: b10x-project-site
